<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTrade — Spot Order Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f2f5;--card:#fff;--border:#e0e0e0;
    --buy:#00c853;--sell:#f44336;
    --text:#111;--muted:#777;--accent:#f7931a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;height:100vh;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,83,0.4)}50%{box-shadow:0 0 0 4px rgba(0,200,83,0)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);}
  .tb-r1{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
  .logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#111;text-decoration:none;}
  .logo span{color:var(--buy);}
  .back-btn{padding:4px 9px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;color:#555;font-size:11px;text-decoration:none;}

  .ws-badges{display:flex;gap:4px;flex-wrap:wrap;}
  .ws-badge{display:flex;align-items:center;gap:4px;background:#f8f8f8;border:1px solid #eee;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;color:#888;}
  .ws-dot{width:5px;height:5px;border-radius:50%;background:#ccc;flex-shrink:0;}
  .ws-dot.on{background:var(--buy);animation:pulse 1.5s infinite;}
  .ws-dot.err{background:var(--sell);}

  .coin-filters{display:flex;gap:3px;flex-wrap:wrap;}
  .coin-btn{padding:3px 9px;border-radius:6px;background:#f5f5f5;border:1px solid #e0e0e0;color:#777;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .coin-btn.active{background:rgba(0,200,83,0.1);border-color:var(--buy);color:#007a30;}

  .view-filters{display:flex;gap:3px;}
  .view-btn{padding:3px 9px;border-radius:6px;background:#f5f5f5;border:1px solid #e0e0e0;color:#777;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .view-btn.active{background:rgba(247,147,26,0.1);border-color:var(--accent);color:var(--accent);}

  .tf-filters{display:flex;gap:3px;margin-left:auto;}
  .tf-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#777;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .tf-btn.active{background:rgba(247,147,26,0.1);border-color:var(--accent);color:var(--accent);}

  .tb-r2{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #f0f0f0;}
  .tb-r2::-webkit-scrollbar{display:none;}
  .sbox{flex:0 0 auto;padding:6px 14px;border-right:1px solid #f0f0f0;min-width:100px;display:flex;flex-direction:column;gap:1px;}
  .sbox:last-child{border-right:none;}
  .sl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#aaa;}
  .sv{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#111;}
  .sv.b{color:var(--buy);}.sv.s{color:var(--sell);}.sv.a{color:var(--accent);}
  .ss{font-size:9px;color:#bbb;}

  .tb-r3{display:flex;align-items:center;gap:8px;padding:4px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0;}
  .ratio-bar{flex:1;height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden;display:flex;}
  .rb{height:100%;border-radius:3px 0 0 3px;background:var(--buy);transition:width 0.5s;}
  .rs{height:100%;border-radius:0 3px 3px 0;background:var(--sell);transition:width 0.5s;}
  .rpct{font-size:9px;font-weight:700;}

  .tb-r4{display:flex;align-items:center;gap:3px;padding:5px 14px;flex-wrap:wrap;}
  .min-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#888;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .min-btn.active{background:rgba(0,200,83,0.1);border-color:var(--buy);color:#007a30;}
  .sound-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#888;font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;margin-left:auto;}
  .sound-btn.on{background:rgba(0,200,83,0.08);border-color:var(--buy);color:var(--buy);}

  .main-wrap{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 260px;}
  @media(max-width:700px){.main-wrap{grid-template-columns:1fr;}.side-panel{display:none;}}
  #spotCanvas{width:100%;height:100%;display:block;}

  .side-panel{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .side-hdr{padding:9px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
  .side-tabs{display:flex;border-bottom:1px solid var(--border);}
  .stab{flex:1;padding:6px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .stab.active{color:var(--buy);border-bottom-color:var(--buy);}

  .feed-list{flex:1;overflow-y:auto;}
  .feed-list::-webkit-scrollbar{width:2px;}
  .feed-list::-webkit-scrollbar-thumb{background:#ddd;}
  .feed-item{padding:7px 11px;border-bottom:1px solid #f8f8f8;animation:slideIn 0.2s ease;}
  .fi-top{display:flex;justify-content:space-between;align-items:center;}
  .fi-sym{font-size:11px;font-weight:700;color:#333;}
  .fi-amt{font-size:11px;font-weight:700;}
  .fi-b{color:var(--buy);}.fi-s{color:var(--sell);}
  .fi-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
  .bb{background:rgba(0,200,83,0.12);color:#007a30;}
  .bs{background:rgba(244,67,54,0.1);color:var(--sell);}
  .fi-bot{display:flex;justify-content:space-between;margin-top:2px;}
  .fi-exch{font-size:9px;color:#888;font-weight:600;}
  .fi-price{font-size:9px;color:#aaa;}
  .fi-time{font-size:9px;color:#ccc;}

  .tooltip{position:fixed;z-index:400;pointer-events:none;display:none;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:12px 16px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,0.1);}
  .tt-title{font-size:13px;font-weight:800;margin-bottom:6px;}
  .tt-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;margin-top:3px;}
  .tt-lbl{color:#888;}.tt-val{font-weight:600;}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="tb-r1">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="logo">🟢 <span>Spot</span> Flow</div>

    <div class="ws-badges">
      <div class="ws-badge"><div class="ws-dot" id="dot-binance"></div>Binance</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-bybit"></div>Bybit</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-okx"></div>OKX</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-bitget"></div>Bitget</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-gate"></div>Gate.io</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-kraken"></div>Kraken</div>
      <div class="ws-badge"><div class="ws-dot" id="dot-kucoin"></div>KuCoin</div>
    </div>

    <div class="coin-filters">
      <button class="coin-btn active" onclick="setCoin('ALL',this)">ALL</button>
      <button class="coin-btn active" onclick="setCoin('BTC',this)">BTC</button>
      <button class="coin-btn active" onclick="setCoin('ETH',this)">ETH</button>
      <button class="coin-btn active" onclick="setCoin('SOL',this)">SOL</button>
      <button class="coin-btn active" onclick="setCoin('BNB',this)">BNB</button>
      <button class="coin-btn active" onclick="setCoin('XRP',this)">XRP</button>
      <button class="coin-btn active" onclick="setCoin('DOGE',this)">DOGE</button>
    </div>

    <div class="view-filters">
      <button class="view-btn active" onclick="setView('split',this)">Split</button>
      <button class="view-btn" onclick="setView('mix',this)">Mixed</button>
    </div>

    <div class="tf-filters">
      <button class="tf-btn active" onclick="setPeriod('session',this)">Session</button>
      <button class="tf-btn" onclick="setPeriod('5m',this)">5m</button>
      <button class="tf-btn" onclick="setPeriod('15m',this)">15m</button>
      <button class="tf-btn" onclick="setPeriod('1h',this)">1h</button>
    </div>
  </div>

  <div class="tb-r2">
    <div class="sbox"><div class="sl">Total Trades</div><div class="sv a" id="sTot">0</div><div class="ss" id="sTotV">$0</div></div>
    <div class="sbox"><div class="sl">Buy Orders</div><div class="sv b" id="sBuy">0</div><div class="ss" id="sBuyV">$0</div></div>
    <div class="sbox"><div class="sl">Sell Orders</div><div class="sv s" id="sSell">0</div><div class="ss" id="sSellV">$0</div></div>
    <div class="sbox"><div class="sl">Buy Volume</div><div class="sv b" id="sBuyVol">$0</div><div class="ss" id="sBuyVolB">0</div></div>
    <div class="sbox"><div class="sl">Sell Volume</div><div class="sv s" id="sSellVol">$0</div><div class="ss" id="sSellVolB">0</div></div>
    <div class="sbox"><div class="sl">Biggest Trade</div><div class="sv" id="sBig">$0</div><div class="ss" id="sBigInfo">—</div></div>
    <div class="sbox"><div class="sl">Trades/Min</div><div class="sv" id="sRate">0</div><div class="ss">live</div></div>
    <div class="sbox"><div class="sl">BTC Price</div><div class="sv a" id="sBTC">—</div><div class="ss">Live</div></div>
  </div>

  <div class="tb-r3">
    <span class="rpct" style="color:var(--buy)" id="bpct">50%</span>
    <span style="font-size:9px;color:#bbb">Buy</span>
    <div class="ratio-bar"><div class="rb" id="rb" style="width:50%"></div><div class="rs" id="rs" style="width:50%"></div></div>
    <span style="font-size:9px;color:#bbb">Sell</span>
    <span class="rpct" style="color:var(--sell)" id="spct">50%</span>
  </div>

  <div class="tb-r4">
    <span style="font-size:10px;color:#aaa;font-weight:600">Min:</span>
    <button class="min-btn active" onclick="setMin(0,this)">All</button>
    <button class="min-btn" onclick="setMin(1000,this)">$1K+</button>
    <button class="min-btn" onclick="setMin(10000,this)">$10K+</button>
    <button class="min-btn" onclick="setMin(50000,this)">$50K+</button>
    <button class="min-btn" onclick="setMin(100000,this)">$100K+</button>
    <button class="min-btn" onclick="setMin(500000,this)">🐳 $500K+</button>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔕 Sound</button>
  </div>
</div>

<div class="main-wrap" id="mainWrap">
  <canvas id="spotCanvas"></canvas>
  <div class="side-panel">
    <div class="side-hdr">
      Spot Trades
      <span id="feedCnt" style="color:var(--buy);text-transform:none;letter-spacing:0;font-size:11px">0</span>
    </div>
    <div class="side-tabs">
      <button class="stab active" onclick="showTab('all',this)">All</button>
      <button class="stab" onclick="showTab('buy',this)" style="color:var(--buy)">Buys</button>
      <button class="stab" onclick="showTab('sell',this)" style="color:var(--sell)">Sells</button>
    </div>
    <div class="feed-list" id="feedList"></div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-title" id="ttTitle">—</div>
  <div class="tt-row"><span class="tt-lbl">Coin</span><span class="tt-val" id="ttSym">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Amount</span><span class="tt-val" id="ttAmt">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Value</span><span class="tt-val" id="ttUSD">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Price</span><span class="tt-val" id="ttPrice">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Exchange</span><span class="tt-val" id="ttExch">—</span></div>
</div>

<script>
let btcPrice=67000, minUSD=0, soundOn=false;
let viewMode='split', activeCoin='ALL', feedTab='all';
let bubbles=[], particles=[], hovered=null, raf;
let stats={tot:0,totV:0,buy:0,buyV:0,sell:0,sellV:0,big:0,bigInfo:'',cnt:0};
let feedCount=0, startTime=Date.now();
let allFeedItems=[];

function coinLogo(sym){
  return `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${sym.toLowerCase()}.png`;
}
const imgCache={};
function getImg(src){ if(imgCache[src]) return imgCache[src]; const i=new Image(); i.crossOrigin='anonymous'; i.src=src; imgCache[src]=i; return i; }

// ===== CANVAS =====
const canvas=document.getElementById('spotCanvas');
const ctx=canvas.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);

function resizeCanvas(){
  const topH=document.getElementById('topbar').offsetHeight||130;
  const panelW=window.innerWidth>700?260:0;
  const W=window.innerWidth-panelW, H=window.innerHeight-topH;
  document.getElementById('mainWrap').style.top=topH+'px';
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas._W=W; canvas._H=H;
}
window.addEventListener('resize',resizeCanvas);

// ===== ADD TRADE =====
function addTrade(d){
  const sym=d.sym.replace(/USDT|BUSD|USDC|BTC$/,'').toUpperCase();
  if(sym==='') return;
  if(activeCoin!=='ALL'&&sym!==activeCoin) return;
  if(d.usd<minUSD) return;

  stats.cnt++; stats.tot++; stats.totV+=d.usd;
  if(d.side==='BUY'){stats.buy++;stats.buyV+=d.usd;}
  else{stats.sell++;stats.sellV+=d.usd;}
  if(d.usd>stats.big){stats.big=d.usd;stats.bigInfo=sym+' '+d.exchange;}
  renderStats();
  spawnBubble({...d,sym});
  addFeedItem({...d,sym});
}

// ===== SPAWN BUBBLE =====
function spawnBubble(d){
  const W=canvas._W||400,H=canvas._H||400;
  const r=Math.min(80,Math.max(16,16+Math.log10(d.usd/100+1)*19));
  const isBuy=d.side==='BUY';
  const col=isBuy?'#00c853':'#f44336';
  const rgb=isBuy?'0,200,83':'244,67,54';

  let x,y;
  if(viewMode==='split'){
    x=isBuy ? r+4+Math.random()*(W/2-r*2-8) : W/2+r+4+Math.random()*(W/2-r*2-8);
    y=r+4+Math.random()*(H-r*2-8);
  } else {
    x=r+4+Math.random()*(W-r*2-8);
    y=r+4+Math.random()*(H-r*2-8);
  }

  const b={
    x,y,r,col,rgb,isBuy,d,sym:d.sym,
    logoImg:getImg(coinLogo(d.sym)),
    life:1,scale:0,popping:false,popP:0,
    vx:(Math.random()-0.5)*0.45,
    vy:(Math.random()-0.5)*0.45,
  };
  bubbles.push(b);
  spawnParticles(x,y,col,5);
  setTimeout(()=>{b.popping=true;},18000);
  if(bubbles.length>250) bubbles.splice(0,2);
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1.5+Math.random()*2,col,alpha:1});
  }
}

// ===== DRAW =====
function drawBubble(b){
  if(b.popping) b.popP=Math.min(1,b.popP+0.05);
  else b.scale=Math.min(1,b.scale+0.12);
  const sc=b.popping?(1-b.popP):b.scale;
  if(sc<=0.01) return;
  const isH=hovered===b;
  ctx.save();
  ctx.globalAlpha=sc;
  ctx.translate(b.x,b.y); ctx.scale(sc,sc); ctx.translate(-b.x,-b.y);

  const glow=ctx.createRadialGradient(b.x,b.y,b.r*0.5,b.x,b.y,b.r+(isH?18:10));
  glow.addColorStop(0,`rgba(${b.rgb},${isH?0.3:0.15})`);
  glow.addColorStop(1,`rgba(${b.rgb},0)`);
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r+(isH?18:10),0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();

  const inner=ctx.createRadialGradient(b.x,b.y,b.r*0.15,b.x,b.y,b.r);
  inner.addColorStop(0,`rgba(${b.rgb},0.03)`);
  inner.addColorStop(0.65,`rgba(${b.rgb},0.12)`);
  inner.addColorStop(0.85,`rgba(${b.rgb},0.26)`);
  inner.addColorStop(1,`rgba(${b.rgb},0.42)`);
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=inner; ctx.fill();

  const shine=ctx.createRadialGradient(b.x-b.r*.28,b.y-b.r*.28,0,b.x,b.y,b.r*.65);
  shine.addColorStop(0,'rgba(255,255,255,0.22)'); shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=shine; ctx.fill();

  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.strokeStyle=isH?'#222':b.col; ctx.lineWidth=isH?3:2.5; ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='middle';

  if(b.r>48){
    const ls=Math.floor(b.r*0.34); const ly=b.y-b.r*0.3;
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save(); ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls); ctx.restore();
    }
    ctx.font=`800 ${Math.floor(b.r*0.18)}px Inter,sans-serif`;
    ctx.fillStyle='#222'; ctx.fillText(b.sym,b.x,b.y+b.r*0.04);
    ctx.font=`700 ${Math.floor(b.r*0.16)}px Inter,sans-serif`;
    ctx.fillStyle=b.col; ctx.fillText(b.isBuy?'BUY ▲':'SELL ▼',b.x,b.y+b.r*0.28);
    ctx.font=`700 ${Math.floor(b.r*0.16)}px Inter,sans-serif`;
    ctx.fillStyle='#111'; ctx.fillText('$'+fmtN(b.d.usd),b.x,b.y+b.r*0.5);
    ctx.font=`600 ${Math.floor(b.r*0.13)}px Inter,sans-serif`;
    ctx.fillStyle='#888'; ctx.fillText(b.d.exchange,b.x,b.y+b.r*0.7);
  } else if(b.r>32){
    const ls=Math.floor(b.r*0.28); const ly=b.y-b.r*0.32;
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.88)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save(); ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls); ctx.restore();
    }
    ctx.font=`800 ${Math.floor(b.r*0.22)}px Inter,sans-serif`;
    ctx.fillStyle='#222'; ctx.fillText(b.sym,b.x,b.y+b.r*0.06);
    ctx.font=`700 ${Math.floor(b.r*0.2)}px Inter,sans-serif`;
    ctx.fillStyle=b.col; ctx.fillText(b.isBuy?'▲':'▼',b.x,b.y+b.r*0.38);
    ctx.font=`700 ${Math.floor(b.r*0.17)}px Inter,sans-serif`;
    ctx.fillStyle='#111'; ctx.fillText('$'+fmtN(b.d.usd),b.x,b.y+b.r*0.62);
  } else if(b.r>20){
    const ls=Math.floor(b.r*0.24); const ly=b.y-b.r*0.35;
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+1,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save(); ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls); ctx.restore();
    }
    ctx.font=`800 ${Math.max(8,Math.floor(b.r*0.28))}px Inter,sans-serif`;
    ctx.fillStyle='#222'; ctx.fillText(b.sym,b.x,b.y+b.r*0.1);
    ctx.font=`700 ${Math.max(7,Math.floor(b.r*0.24))}px Inter,sans-serif`;
    ctx.fillStyle=b.col; ctx.fillText(b.isBuy?'▲':'▼',b.x,b.y+b.r*0.46);
  } else {
    ctx.font=`800 ${Math.max(7,Math.floor(b.r*0.44))}px Inter,sans-serif`;
    ctx.fillStyle=b.col; ctx.fillText(b.isBuy?'▲':'▼',b.x,b.y-b.r*0.1);
    ctx.font=`700 ${Math.max(6,Math.floor(b.r*0.3))}px Inter,sans-serif`;
    ctx.fillStyle='#333'; ctx.fillText(b.sym.slice(0,3),b.x,b.y+b.r*0.32);
  }

  ctx.restore(); ctx.globalAlpha=1;
}

function drawDivider(){
  if(viewMode!=='split') return;
  const W=canvas._W||400,H=canvas._H||400;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H);
  ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
  ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 11px Inter,sans-serif';
  ctx.fillStyle='rgba(0,200,83,0.5)'; ctx.fillText('▲ BUY ORDERS',W/4,14);
  ctx.fillStyle='rgba(244,67,54,0.5)'; ctx.fillText('▼ SELL ORDERS',W*3/4,14);
}

function animate(){
  raf=requestAnimationFrame(animate);
  const W=canvas._W||400,H=canvas._H||400;
  ctx.clearRect(0,0,W,H);
  drawDivider();

  particles=particles.filter(p=>p.alpha>0.04);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.alpha-=0.025; ctx.globalAlpha=p.alpha; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.col; ctx.fill(); });
  ctx.globalAlpha=1;

  bubbles=bubbles.filter(b=>!(b.popping&&b.popP>=1));
  bubbles.forEach(b=>{
    if(b.popping&&b.popP<0.3) spawnParticles(b.x,b.y,b.col,2);
    b.x+=b.vx; b.y+=b.vy;
    const W2=canvas._W||400,H2=canvas._H||400;
    if(viewMode==='split'){
      if(b.isBuy){ if(b.x-b.r<0){b.x=b.r;b.vx*=-1;} if(b.x+b.r>W2/2){b.x=W2/2-b.r;b.vx*=-1;} }
      else{ if(b.x-b.r<W2/2){b.x=W2/2+b.r;b.vx*=-1;} if(b.x+b.r>W2){b.x=W2-b.r;b.vx*=-1;} }
    } else {
      if(b.x-b.r<0){b.x=b.r;b.vx*=-1;} if(b.x+b.r>W2){b.x=W2-b.r;b.vx*=-1;}
    }
    if(b.y-b.r<0){b.y=b.r;b.vy*=-1;} if(b.y+b.r>H2){b.y=H2-b.r;b.vy*=-1;}
    b.vx*=0.999; b.vy*=0.999;
    drawBubble(b);
  });
}

function connectBinance(){
  const streams=BIN_SPOT.map(s=>s+'@aggTrade').join('/');

  wsBin.onopen=()=>setDot('binance','on');

    try{
      const msg=JSON.parse(e.data); const d=msg.data||msg;
      if(!d.s) return;
      const sym=d.s.replace('USDT','');
      const qty=parseFloat(d.q)||0;
      const price=parseFloat(d.p)||0;
      const usd=qty*price;
      if(usd<200) return;
      // m=true: buyer is market maker = seller aggressed = SELL
      const side=d.m?'SELL':'BUY';
      addTrade({exchange:'Binance',sym,side,qty,price,usd});
    }catch(e){}
  };
  wsBin.onerror=()=>setDot('binance','err');
  wsBin.onclose=()=>{setDot('binance','');setTimeout(connectBinance,3000);};
}

    };
    wsKucoin.onmessage=e=>{
      try{
        const d=JSON.parse(e.data); if(d.type!=='message'||!d.data) return;
        const o=d.data;
        const sym=(o.symbol||'BTC-USDT').replace('-USDT','').replace('-','');
        const qty=parseFloat(o.size)||0;
        const price=parseFloat(o.price)||0;
        const usd=qty*price; if(usd<200) return;
        const side=o.side==='buy'?'BUY':'SELL';
        addTrade({exchange:'KuCoin',sym,side,qty,price,usd});
      }catch(e){}
    };
    wsKucoin.onerror=()=>setDot('kucoin','err');

}

// HOVER
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
  hovered=null;
  for(const b of bubbles){if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){hovered=b;break;}}
  canvas.style.cursor=hovered?'pointer':'default';
  const tt=document.getElementById('tooltip');
  if(hovered){
    tt.style.display='block'; tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-110)+'px';
    document.getElementById('ttTitle').innerHTML=`<span style="color:${hovered.col}">${hovered.isBuy?'▲ BUY':'▼ SELL'}</span>`;
    document.getElementById('ttSym').textContent=hovered.sym;
    document.getElementById('ttAmt').textContent=hovered.d.qty.toFixed(4)+' '+hovered.sym;
    document.getElementById('ttUSD').textContent='$'+fmtN(hovered.d.usd);
    document.getElementById('ttPrice').textContent='$'+(hovered.d.price||0).toLocaleString('en-US',{maximumFractionDigits:2});
    document.getElementById('ttExch').textContent=hovered.d.exchange;
  } else tt.style.display='none';
});
canvas.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.display='none';hovered=null;});
canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; const r=canvas.getBoundingClientRect(); const mx=t.clientX-r.left,my=t.clientY-r.top; for(const b of bubbles){if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){hovered=b;break;}} },{passive:true});
