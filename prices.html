<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Prices</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --card: #f8f9fa;
            --border: #e9ecef;
            --text: #212529;
            --muted: #6c757d;
            --green: #20c997;
            --red: #dc3545;
            --accent: #fd7e14;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; }
        
        .terminal-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        .market-row { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        /* Price At The Absolute Top Block */
        .top-price-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border); padding-bottom: 12px;
        }
        .live-price-box { display: flex; align-items: baseline; gap: 10px; }
        .live-price { font-size: 22px; font-weight: 700; color: #000; font-variant-numeric: tabular-nums; }
        
        /* Unique Data Grid (No Repetitions) */
        .data-grid { 
            display: grid; grid-template-columns: 2fr 3.5fr 2.5fr 2fr; gap: 15px; align-items: flex-start;
        }
        
        .coin-meta { display: flex; align-items: center; gap: 12px; }
        .coin-rank { font-size: 11px; font-weight: 700; color: #fff; background: var(--text); padding: 2px 6px; border-radius: 4px; }
        .coin-logo { width: 36px; height: 36px; border-radius: 50%; }
        .coin-name { font-size: 15px; font-weight: 700; }
        .coin-symbol { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
        
        .section-title { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .sub-value { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
        
        .timeline-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        .stats-panel { background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        
        /* Bottom Fixed Market Cap Bar */
        .footer-market-bar { 
            background: #f1f3f5; padding: 10px 14px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 12px;
        }
        .footer-item { display: flex; gap: 6px; align-items: center; }
        .footer-label { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; }
        
        .btn-container { display: flex; justify-content: center; margin: 40px 0; }
        .next-btn { background: #212529; color: #fff; border: none; padding: 14px 40px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .next-btn:hover { background: #000; }
        .loading { text-align: center; padding: 50px; color: var(--muted); font-weight: 600; font-size: 16px; }
        
        @media (max-width: 768px) {
            .data-grid { grid-template-columns: 1fr; }
            .footer-market-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
            .timeline-box { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="terminal-container" id="listWrapper">
    <div id="initialLoading" class="loading">Connecting Sockets & Structuring White Dashboard...</div>
</div>

<div class="btn-container">
    <button id="loadMoreBtn" class="next-btn" style="display:none;" onclick="loadMoreCoins()">Load Next 50 Coins ↓</button>
</div>

<script>
let allMasterCoins = [];
let displayedCoins = [];
let currentIndex = 0;
let spotSocket = null;
let futuresSocket = null;

// STEP 1: Fetching Unique Data via CoinGecko (Added 30d change)
async function fetchCleanWhiteData() {
    try {
        const url1 = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=1h,24h,7d,30d';
        const url2 = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=2&sparkline=false&price_change_percentage=1h,24h,7d,30d';
        
        const [res1, res2] = await Promise.all([fetch(url1), fetch(url2)]);
        const data1 = await res1.json();
        const data2 = await res2.json();
        const full500List = data1.concat(data2);
        
        allMasterCoins = full500List.map((coin, index) => {
            return {
                rank: index + 1,
                name: coin.name,
                symbol: coin.symbol.toUpperCase(),
                binanceSymbol: coin.symbol.toUpperCase() + 'USDT',
                logo: coin.image,
                marketCap: coin.market_cap,
                supply: coin.circulating_supply,
                ath: coin.ath,
                atl: coin.atl,
                ch1h: coin.price_change_percentage_1h_in_currency || 0,
                ch24h: coin.price_change_percentage_24h_in_currency || 0,
                ch7d: coin.price_change_percentage_7d_in_currency || 0,
                ch30d: coin.price_change_percentage_30d_in_currency || 0,
                initialPrice: coin.current_price
            };
        });

        document.getElementById('initialLoading').style.display = 'none';
        document.getElementById('loadMoreBtn').style.display = 'block';
        
        loadMoreCoins();

    } catch (error) {
        console.error("Data Fetch Error:", error);
        document.getElementById('initialLoading').innerText = "Network pipeline error. Please reload.";
    }
}

// STEP 2: Rendering Layout (Price at the top, No Repeated Items)
function loadMoreCoins() {
    const listWrapper = document.getElementById('listWrapper');
    const nextBatch = allMasterCoins.slice(currentIndex, currentIndex + 50);
    
    if (nextBatch.length === 0) return;

    nextBatch.forEach(c => {
        const rowHtml = `
            <div class="market-row" id="row-${c.symbol}">
                
                <div class="top-price-header">
    <div class="live-price-box">
        <span class="live-price" id="price-${c.symbol}">$${formatPrice(c.initialPrice)}</span>
        <span id="chgPct-${c.symbol}" style="font-size:13px; font-weight:600;">--%</span>
        <span style="font-size: 11px; color: var(--muted); font-weight:500; margin-left: 12px;">
            Trades Loop: <span id="trades-${c.symbol}" style="color:var(--text); font-weight:600;">--</span>
        </span>
    </div>
</div>

                <div class="data-grid">
                    
                    <div class="coin-meta">
                        <span class="coin-rank">#${c.rank}</span>
                        <img src="${c.logo}" class="coin-logo" alt="${c.name}">
                        <div>
                            <div class="coin-name">${c.name}</div>
                            <div class="coin-symbol">${c.symbol}/USDT</div>
                        </div>
                    </div>

                    <div class="timeline-box">
                        <div>
                            <div class="section-title">1H</div>
                            <div class="value" style="color:${c.ch1h >= 0 ? 'var(--green)':'var(--red)'}">${c.ch1h.toFixed(2)}%</div>
                        </div>
                        <div>
                            <div class="section-title">24H (Gecko)</div>
                            <div class="value" style="color:${c.ch24h >= 0 ? 'var(--green)':'var(--red)'}">${c.ch24h.toFixed(2)}%</div>
                        </div>
                        <div>
                            <div class="section-title">7D</div>
                            <div class="value" style="color:${c.ch7d >= 0 ? 'var(--green)':'var(--red)'}">${c.ch7d.toFixed(2)}%</div>
                        </div>
                        <div>
                            <div class="section-title">30D</div>
                            <div class="value" style="color:${c.ch30d >= 0 ? 'var(--green)':'var(--red)'}">${c.ch30d.toFixed(2)}%</div>
                        </div>
                    </div>

                    <div class="stats-panel">
                        <div class="section-title">Session High/Low & Depth</div>
                        <div class="sub-value" style="margin-top:0;">High: <span id="high-${c.symbol}" style="color:var(--text)">--</span> | Low: <span id="low-${c.symbol}" style="color:var(--text)">--</span></div>
                        <div class="sub-value">Best Bid: <span id="bid-${c.symbol}" style="color:var(--green)">--</span> | Best Ask: <span id="ask-${c.symbol}" style="color:var(--red)">--</span></div>
                    </div>

                    <div class="stats-panel">
                        <div class="section-title">Live Volumes & Funding</div>
                        <div class="sub-value" style="margin-top:0;">Coin Vol: <span id="volCoin-${c.symbol}" style="color:var(--text)">--</span></div>
                        <div class="sub-value">USDT Vol: <span id="volUsdt-${c.symbol}" style="color:var(--text)">--</span></div>
                        <div class="sub-value" style="font-weight:600;">Funding: <span id="funding-${c.symbol}">--</span></div>
                    </div>

                </div>

                <div class="footer-market-bar">
                    <div class="footer-item">
                        <span class="footer-label">Market Cap:</span>
                        <span style="font-weight:700; color:#000;">$${c.marketCap.toLocaleString()}</span>
                    </div>
                    <div class="footer-item">
                        <span class="footer-label">Circulating Supply:</span>
                        <span>${c.supply.toLocaleString()} ${c.symbol}</span>
                    </div>
                    <div class="footer-item">
                        <span class="footer-label">ATH:</span>
                        <span style="color:var(--green)">$${formatPrice(c.ath)}</span>
                    </div>
                    <div class="footer-item">
                        <span class="footer-label">ATL:</span>
                        <span style="color:var(--red)">$${formatPrice(c.atl)}</span>
                    </div>
                </div>

            </div>
        `;
        listWrapper.insertAdjacentHTML('beforeend', rowHtml);
    });

    displayedCoins = displayedCoins.concat(nextBatch);
    currentIndex += 50;

    if (currentIndex >= allMasterCoins.length) {
        document.getElementById('loadMoreBtn').style.display = 'none';
    }

    connectCleanStreams();
}

// STEP 3: Connecting Sockets Without Any Repetitive Fields
function connectCleanStreams() {
    if (spotSocket) spotSocket.close();
    if (futuresSocket) futuresSocket.close();

    const symbols = displayedCoins.map(c => c.symbol.toLowerCase());

    // 1. Spot Stream Pipeline (`@ticker`)
    const spotStreams = symbols.map(s => `${s}usdt@ticker`).join('/');
    spotSocket = new WebSocket(`wss://stream.binance.com:9443/ws/${spotStreams}`);

    spotSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (!data.s) return;
        const sym = data.s.replace('USDT', '');

        const priceEl = document.getElementById(`price-${sym}`);
        const chgPctEl = document.getElementById(`chgPct-${sym}`);
        const tradesEl = document.getElementById(`trades-${sym}`);
        const highEl = document.getElementById(`high-${sym}`);
        const lowEl = document.getElementById(`low-${sym}`);
        const volCoinEl = document.getElementById(`volCoin-${sym}`);
        const volUsdtEl = document.getElementById(`volUsdt-${sym}`);
        const bidEl = document.getElementById(`bid-${sym}`);
        const askEl = document.getElementById(`ask-${sym}`);

        if (priceEl) priceEl.innerText = `$${formatPrice(parseFloat(data.c))}`;
        if (highEl) highEl.innerText = formatPrice(parseFloat(data.h));
        if (lowEl) lowEl.innerText = formatPrice(parseFloat(data.l));
        if (bidEl) bidEl.innerText = formatPrice(parseFloat(data.b));
        if (askEl) askEl.innerText = formatPrice(parseFloat(data.a));
        if (tradesEl) tradesEl.innerText = parseInt(data.n).toLocaleString();

        if (chgPctEl) {
            const p = parseFloat(data.P);
            chgPctEl.innerText = `${p >= 0 ? '+' : ''}${p.toFixed(2)}% (WSS)`;
            chgPctEl.style.color = p >= 0 ? 'var(--green)' : 'var(--red)';
        }

        if (volCoinEl) volCoinEl.innerText = parseFloat(data.v).toLocaleString(undefined, {maximumFractionDigits:0});
        if (volUsdtEl) {
            const q = parseFloat(data.q);
            volUsdtEl.innerText = q >= 1e6 ? `$${(q/1e6).toFixed(2)}M` : `$${q.toLocaleString(undefined, {maximumFractionDigits:0})}`;
        }
    };

    // 2. Futures Mark Price Pipeline (`@markPrice`) for Live Funding Rate
    const futuresStreams = symbols.map(s => `${s}usdt@markPrice`).join('/');
    futuresSocket = new WebSocket(`wss://fstream.binance.com/ws/${futuresStreams}`);

    futuresSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (!data.s) return;
        const sym = data.s.replace('USDT', '');

        const fundingEl = document.getElementById(`funding-${sym}`);
        if (fundingEl && data.r) {
            const fRate = parseFloat(data.r) * 100;
            fundingEl.innerText = `${fRate >= 0 ? '+' : ''}${fRate.toFixed(4)}%`;
            fundingEl.style.color = fRate >= 0 ? 'var(--green)' : 'var(--red)';
        }
    };

    spotSocket.onclose = () => setTimeout(connectCleanStreams, 4000);
}

function formatPrice(n) {
    if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (n >= 1) return n.toFixed(2);
    return n.toFixed(6);
}

fetchCleanWhiteData();
</script>
</body>
</html>
