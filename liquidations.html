<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTrade — Live Liquidations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f2f5;--card:#fff;--border:#e0e0e0;
    --long:#00c853;--short:#f44336;
    --text:#111;--muted:#777;--accent:#f7931a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;height:100vh;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,83,0.4)}50%{box-shadow:0 0 0 4px rgba(0,200,83,0)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

  /* TOPBAR */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);}
  .tb-r1{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
  .logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#111;text-decoration:none;}
  .logo span{color:var(--short);}
  .back-btn{padding:4px 9px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;color:#555;font-size:11px;text-decoration:none;}

  .ws-badges{display:flex;gap:4px;flex-wrap:wrap;}
  .ws-badge{display:flex;align-items:center;gap:4px;background:#f8f8f8;border:1px solid #eee;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;color:#888;}
  .ws-badge .dot{width:5px;height:5px;border-radius:50%;background:#ccc;flex-shrink:0;}
  .ws-badge .dot.on{background:var(--long);animation:pulse 1.5s infinite;}
  .ws-badge .dot.err{background:var(--short);}

  .exch-filters{display:flex;gap:3px;flex-wrap:wrap;}
  .exch-btn{padding:3px 10px;border-radius:6px;background:#f5f5f5;border:1px solid #e0e0e0;color:#777;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .exch-btn.active{background:rgba(244,67,54,0.1);border-color:var(--short);color:var(--short);}

  .tf-filters{display:flex;gap:3px;margin-left:auto;}
  .tf-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#777;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .tf-btn.active{background:rgba(247,147,26,0.1);border-color:var(--accent);color:var(--accent);}

  /* STATS */
  .tb-r2{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #f0f0f0;}
  .tb-r2::-webkit-scrollbar{display:none;}
  .sbox{flex:0 0 auto;padding:6px 14px;border-right:1px solid #f0f0f0;min-width:100px;display:flex;flex-direction:column;gap:1px;}
  .sbox:last-child{border-right:none;}
  .sl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#aaa;}
  .sv{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#111;}
  .sv.long{color:var(--long);} .sv.short{color:var(--short);} .sv.btc{color:var(--accent);}
  .ss{font-size:9px;color:#bbb;}

  /* RATIO */
  .tb-r3{display:flex;align-items:center;gap:8px;padding:4px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0;}
  .ratio-bar{flex:1;height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden;display:flex;}
  .rl{height:100%;border-radius:3px 0 0 3px;background:var(--long);transition:width 0.5s;}
  .rs{height:100%;border-radius:0 3px 3px 0;background:var(--short);transition:width 0.5s;}
  .rpct{font-size:9px;font-weight:700;}

  /* MIN FILTER */
  .tb-r4{display:flex;align-items:center;gap:3px;padding:5px 14px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
  .min-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#888;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
  .min-btn.active{background:rgba(244,67,54,0.08);border-color:var(--short);color:var(--short);}
  .sound-btn{padding:3px 8px;border-radius:5px;background:#f5f5f5;border:1px solid #e0e0e0;color:#888;font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;margin-left:auto;}
  .sound-btn.on{background:rgba(0,200,83,0.08);border-color:var(--long);color:var(--long);}

  /* MAIN */
  .main-wrap{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 260px;}
  @media(max-width:700px){.main-wrap{grid-template-columns:1fr;}.side-panel{display:none;}}
  #liqCanvas{width:100%;height:100%;display:block;}

  /* SIDE PANEL */
  .side-panel{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .side-hdr{padding:9px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
  .feed-list{flex:1;overflow-y:auto;}
  .feed-list::-webkit-scrollbar{width:2px;}
  .feed-list::-webkit-scrollbar-thumb{background:#ddd;}
  .feed-item{padding:7px 11px;border-bottom:1px solid #f8f8f8;cursor:pointer;transition:background 0.15s;animation:slideIn 0.2s ease;}
  .feed-item:hover{background:#fafafa;}
  .fi-top{display:flex;justify-content:space-between;align-items:center;}
  .fi-sym{font-size:11px;font-weight:700;color:#333;}
  .fi-amt{font-size:11px;font-weight:700;}
  .fi-long{color:var(--long);} .fi-short{color:var(--short);}
  .fi-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
  .b-long{background:rgba(0,200,83,0.12);color:#007a30;}
  .b-short{background:rgba(244,67,54,0.1);color:var(--short);}
  .fi-bot{display:flex;justify-content:space-between;margin-top:2px;}
  .fi-exch{font-size:9px;color:#888;font-weight:600;}
  .fi-price{font-size:9px;color:#aaa;}
  .fi-time{font-size:9px;color:#ccc;}

  /* TOOLTIP */
  .tooltip{position:fixed;z-index:400;pointer-events:none;display:none;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:12px 16px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,0.1);}
  .tt-title{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .tt-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;margin-top:3px;}
  .tt-lbl{color:#888;} .tt-val{font-weight:600;}

  /* WAITING */
  #waitMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;text-align:center;pointer-events:none;}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="tb-r1">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="logo">💥 <span>Liq</span>Tracker</div>

    <!-- WS Status per exchange -->
    <div class="ws-badges">
      <div class="ws-badge"><div class="dot" id="dot-binance"></div>Binance</div>
      <div class="ws-badge"><div class="dot" id="dot-bybit"></div>Bybit</div>
      <div class="ws-badge"><div class="dot" id="dot-okx"></div>OKX</div>
      <div class="ws-badge"><div class="dot" id="dot-bitget"></div>Bitget</div>
      <div class="ws-badge"><div class="dot" id="dot-gate"></div>Gate.io</div>
      <div class="ws-badge"><div class="dot" id="dot-htx"></div>HTX</div>
    </div>

    <!-- Exchange filters -->
    <div class="exch-filters">
      <button class="exch-btn active" onclick="toggleExch('Binance',this)">Binance</button>
      <button class="exch-btn active" onclick="toggleExch('Bybit',this)">Bybit</button>
      <button class="exch-btn active" onclick="toggleExch('OKX',this)">OKX</button>
      <button class="exch-btn active" onclick="toggleExch('Bitget',this)">Bitget</button>
      <button class="exch-btn active" onclick="toggleExch('Gate',this)">Gate.io</button>
      <button class="exch-btn active" onclick="toggleExch('HTX',this)">HTX</button>
    </div>

    <!-- Time period -->
    <div class="tf-filters">
      <button class="tf-btn active" onclick="setPeriod('session',this)">Session</button>
      <button class="tf-btn" onclick="setPeriod('5m',this)">5m</button>
      <button class="tf-btn" onclick="setPeriod('15m',this)">15m</button>
      <button class="tf-btn" onclick="setPeriod('1h',this)">1h</button>
      <button class="tf-btn" onclick="setPeriod('4h',this)">4h</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="tb-r2">
    <div class="sbox"><div class="sl">Total Liq</div><div class="sv btc" id="sTot">$0</div><div class="ss" id="sTotB">0.00 ₿</div></div>
    <div class="sbox"><div class="sl">Longs</div><div class="sv long" id="sLong">$0</div><div class="ss" id="sLongB">0 txs</div></div>
    <div class="sbox"><div class="sl">Shorts</div><div class="sv short" id="sShort">$0</div><div class="ss" id="sShortB">0 txs</div></div>
    <div class="sbox"><div class="sl">Biggest</div><div class="sv" id="sBig">$0</div><div class="ss" id="sBigInfo">—</div></div>
    <div class="sbox"><div class="sl">Count</div><div class="sv" id="sCnt">0</div><div class="ss" id="sRate">0/min</div></div>
    <div class="sbox"><div class="sl">BTC Price</div><div class="sv btc" id="sBTC">—</div><div class="ss">Live</div></div>
  </div>

  <!-- RATIO BAR -->
  <div class="tb-r3">
    <span class="rpct" style="color:var(--long)" id="lpct">0%</span>
    <span style="font-size:9px;color:#bbb">Longs</span>
    <div class="ratio-bar"><div class="rl" id="rl" style="width:50%"></div><div class="rs" id="rs" style="width:50%"></div></div>
    <span style="font-size:9px;color:#bbb">Shorts</span>
    <span class="rpct" style="color:var(--short)" id="spct">0%</span>
  </div>

  <!-- MIN FILTER -->
  <div class="tb-r4">
    <span style="font-size:10px;color:#aaa;font-weight:600">Min:</span>
    <button class="min-btn active" onclick="setMin(0,this)">All</button>
    <button class="min-btn" onclick="setMin(10000,this)">$10K+</button>
    <button class="min-btn" onclick="setMin(50000,this)">$50K+</button>
    <button class="min-btn" onclick="setMin(100000,this)">$100K+</button>
    <button class="min-btn" onclick="setMin(500000,this)">$500K+</button>
    <button class="min-btn" onclick="setMin(1000000,this)">$1M+</button>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔕 Sound</button>
  </div>
</div>

<div class="main-wrap" id="mainWrap">
  <canvas id="liqCanvas"></canvas>
  <div class="side-panel">
    <div class="side-hdr">
      Live Feed
      <span id="feedCnt" style="color:var(--short);text-transform:none;letter-spacing:0;font-size:11px">0</span>
    </div>
    <div class="feed-list" id="feedList"></div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-title" id="ttTitle">—</div>
  <div class="tt-row"><span class="tt-lbl">Coin</span><span class="tt-val" id="ttSym">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Amount</span><span class="tt-val" id="ttAmt">—</span></div>
  <div class="tt-row"><span class="tt-lbl">USD Value</span><span class="tt-val" id="ttUSD">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Price</span><span class="tt-val" id="ttPrice">—</span></div>
  <div class="tt-row"><span class="tt-lbl">Exchange</span><span class="tt-val" id="ttExch">—</span></div>
</div>

<div id="waitMsg" style="display:none">
  <div style="font-size:44px;margin-bottom:10px">💥</div>
  <div style="font-size:14px;font-weight:600;color:#888">Liquidations ka intezaar...</div>
  <div style="font-size:11px;color:#bbb;margin-top:4px">Binance + Bybit + OKX connected</div>
  <div style="width:28px;height:28px;border:2px solid #eee;border-top-color:var(--short);border-radius:50%;animation:spin 0.8s linear infinite;margin:12px auto 0"></div>
</div>

<script>
// ===== CONFIG =====
let btcPrice=67000, minUSD=0, soundOn=false;
let activeExchanges=new Set(['Binance','Bybit','OKX','Bitget','Gate','HTX']);
let bubbles=[], particles=[], hovered=null, raf;
let stats={tot:0,totB:0,long:0,longCnt:0,short:0,shortCnt:0,big:0,bigInfo:'',cnt:0};
let feedCount=0, startTime=Date.now();
const seenHashes=new Set();

// Coin logos from jsdelivr
function coinLogo(sym){
  const s=sym.replace('USDT','').replace('BUSD','').replace('PERP','').toLowerCase();
  return `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${s}.png`;
}

// ===== CANVAS =====
const canvas=document.getElementById('liqCanvas');
const ctx=canvas.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);

function resizeCanvas(){
  const topH=document.getElementById('topbar').offsetHeight||130;
  const panelW=window.innerWidth>700?260:0;
  const W=window.innerWidth-panelW, H=window.innerHeight-topH;
  document.getElementById('mainWrap').style.top=topH+'px';
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas._W=W; canvas._H=H;
}
window.addEventListener('resize',resizeCanvas);

// ===== ADD LIQUIDATION =====
function addLiq(d){
  if(!activeExchanges.has(d.exchange)) return;
  if(d.usd<minUSD) return;
  // Deduplicate
  const key=d.exchange+d.sym+d.side+Math.round(d.usd/100);
  if(seenHashes.has(key)) return;
  seenHashes.add(key);
  setTimeout(()=>seenHashes.delete(key),5000);

  // Update stats
  stats.cnt++; stats.tot+=d.usd; stats.totB+=d.qty;
  if(d.side==='LONG'){stats.long+=d.usd;stats.longCnt++;}
  else{stats.short+=d.usd;stats.shortCnt++;}
  if(d.usd>stats.big){stats.big=d.usd;stats.bigInfo=d.sym+' '+d.exchange;}
  renderStats();

  spawnBubble(d);
  addFeedItem(d);
  hideWaiting();
  if(soundOn&&d.usd>=50000) playSound(d.usd,d.side);
}

// ===== SPAWN BUBBLE =====
const imgCache={};
function getImg(src){
  if(imgCache[src]) return imgCache[src];
  const img=new Image(); img.crossOrigin='anonymous';
  img.src=src; imgCache[src]=img;
  return img;
}

function spawnBubble(d){
  const W=canvas._W||400,H=canvas._H||400;
  const r=Math.min(85,Math.max(22,22+Math.log10(d.usd/1000+1)*26));
  const isLong=d.side==='LONG';
  const col=isLong?'#00c853':'#f44336';
  const rgb=isLong?'0,200,83':'244,67,54';
  const logoImg=getImg(coinLogo(d.sym));

  const b={
    x:r+6+Math.random()*(W-r*2-12),
    y:r+6+Math.random()*(H-r*2-12),
    r,col,rgb,isLong,d,
    logoImg, sym:d.sym.replace('USDT','').replace('BUSD','').replace('PERP',''),
    life:1, scale:0,
    vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
    popping:false, popP:0,
  };
  bubbles.push(b);
  spawnParticles(b.x,b.y,col,10);

  setTimeout(()=>{b.popping=true;},28000);
  if(bubbles.length>150) bubbles.splice(0,2);
}

// ===== PARTICLES =====
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*3,col,alpha:1});
  }
}

// ===== DRAW BUBBLE =====
function drawBubble(b){
  if(b.popping) b.popP=Math.min(1,b.popP+0.045);
  else b.scale=Math.min(1,b.scale+0.1);
  const sc=b.popping?(1-b.popP):b.scale;
  if(sc<=0.01) return;

  const isH=hovered===b;
  ctx.save();
  ctx.globalAlpha=sc;
  ctx.translate(b.x,b.y); ctx.scale(sc,sc); ctx.translate(-b.x,-b.y);

  // Outer glow
  const glow=ctx.createRadialGradient(b.x,b.y,b.r*0.5,b.x,b.y,b.r+(isH?20:12));
  glow.addColorStop(0,`rgba(${b.rgb},${isH?0.35:0.18})`);
  glow.addColorStop(1,`rgba(${b.rgb},0)`);
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r+(isH?20:12),0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();

  // Inner transparent fill
  const inner=ctx.createRadialGradient(b.x,b.y,b.r*0.15,b.x,b.y,b.r);
  inner.addColorStop(0,  `rgba(${b.rgb},0.03)`);
  inner.addColorStop(0.6,`rgba(${b.rgb},0.1)`);
  inner.addColorStop(0.85,`rgba(${b.rgb},0.25)`);
  inner.addColorStop(1,  `rgba(${b.rgb},0.42)`);
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=inner; ctx.fill();

  // Glass shine
  const shine=ctx.createRadialGradient(b.x-b.r*0.28,b.y-b.r*0.28,0,b.x,b.y,b.r*0.65);
  shine.addColorStop(0,'rgba(255,255,255,0.22)'); shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=shine; ctx.fill();

  // Border
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.strokeStyle=isH?'#222':b.col; ctx.lineWidth=isH?3:2.5; ctx.stroke();

  // ===== CONTENT =====
  ctx.textAlign='center'; ctx.textBaseline='middle';

  if(b.r>52){
    // LARGE: logo + coin name + side + usd
    const ls=Math.floor(b.r*0.36);
    const ly=b.y-b.r*0.32;
    // Logo white bg
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls);
      ctx.restore();
    } else {
      ctx.font=`800 ${Math.floor(ls*0.7)}px Inter,sans-serif`;
      ctx.fillStyle=b.col;
      ctx.fillText(b.sym.slice(0,3),b.x,ly);
    }
    // Coin name
    ctx.font=`800 ${Math.floor(b.r*0.18)}px Inter,sans-serif`;
    ctx.fillStyle='#333'; ctx.fillText(b.sym,b.x,b.y-b.r*0.02);
    // Side
    ctx.font=`700 ${Math.floor(b.r*0.17)}px Inter,sans-serif`;
    ctx.fillStyle=b.col;
    ctx.fillText(b.isLong?'LONG 📈':'SHORT 📉',b.x,b.y+b.r*0.24);
    // USD
    ctx.font=`700 ${Math.floor(b.r*0.17)}px Inter,sans-serif`;
    ctx.fillStyle='#111';
    ctx.fillText('$'+fmtN(b.d.usd),b.x,b.y+b.r*0.48);

  } else if(b.r>34){
    // MEDIUM: logo + sym + side + usd
    const ls=Math.floor(b.r*0.3);
    const ly=b.y-b.r*0.33;
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.88)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls);
      ctx.restore();
    }
    ctx.font=`800 ${Math.floor(b.r*0.22)}px Inter,sans-serif`;
    ctx.fillStyle='#333'; ctx.fillText(b.sym,b.x,b.y+b.r*0.04);
    ctx.font=`700 ${Math.floor(b.r*0.2)}px Inter,sans-serif`;
    ctx.fillStyle=b.col;
    ctx.fillText(b.isLong?'LONG':'SHORT',b.x,b.y+b.r*0.34);
    ctx.font=`700 ${Math.floor(b.r*0.18)}px Inter,sans-serif`;
    ctx.fillStyle='#111';
    ctx.fillText('$'+fmtN(b.d.usd),b.x,b.y+b.r*0.6);

  } else if(b.r>22){
    // SMALL: sym + side
    const ls=Math.floor(b.r*0.26);
    const ly=b.y-b.r*0.35;
    ctx.beginPath(); ctx.arc(b.x,ly,ls/2+1,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
    if(b.logoImg.complete&&b.logoImg.naturalWidth>0){
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x,ly,ls/2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(b.logoImg,b.x-ls/2,ly-ls/2,ls,ls);
      ctx.restore();
    }
    ctx.font=`800 ${Math.max(8,Math.floor(b.r*0.26))}px Inter,sans-serif`;
    ctx.fillStyle='#333'; ctx.fillText(b.sym,b.x,b.y+b.r*0.1);
    ctx.font=`700 ${Math.max(7,Math.floor(b.r*0.22))}px Inter,sans-serif`;
    ctx.fillStyle=b.col;
    ctx.fillText(b.isLong?'L':'S',b.x,b.y+b.r*0.44);

  } else {
    ctx.font=`800 ${Math.max(7,Math.floor(b.r*0.42))}px Inter,sans-serif`;
    ctx.fillStyle=b.col;
    ctx.fillText(b.sym.slice(0,3),b.x,b.y-b.r*0.1);
    ctx.font=`700 ${Math.max(6,Math.floor(b.r*0.32))}px Inter,sans-serif`;
    ctx.fillStyle='#333';
    ctx.fillText(b.isLong?'L':'S',b.x,b.y+b.r*0.32);
  }

  ctx.restore(); ctx.globalAlpha=1;
}

// ===== ANIMATE =====
function animate(){
  raf=requestAnimationFrame(animate);
  const W=canvas._W||400,H=canvas._H||400;
  ctx.clearRect(0,0,W,H);

  particles=particles.filter(p=>p.alpha>0.04);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.alpha-=0.022;
    ctx.globalAlpha=p.alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  });
  ctx.globalAlpha=1;

  bubbles=bubbles.filter(b=>!(b.popping&&b.popP>=1));
  bubbles.forEach(b=>{
    if(b.popping&&b.popP<0.3) spawnParticles(b.x,b.y,b.col,2);
    b.x+=b.vx; b.y+=b.vy;
    const W2=canvas._W||400,H2=canvas._H||400;
    if(b.x-b.r<0){b.x=b.r;b.vx*=-1;}
    if(b.x+b.r>W2){b.x=W2-b.r;b.vx*=-1;}
    if(b.y-b.r<0){b.y=b.r;b.vy*=-1;}
    if(b.y+b.r>H2){b.y=H2-b.r;b.vy*=-1;}
    b.vx*=0.999; b.vy*=0.999;
    drawBubble(b);
  });
}

// --- BINANCE REST: recent liquidations poll ---
let lastRestTime=Date.now()-300000; // last 5 min
async function pollBinanceREST(){
  try{
    const res=await fetch(`https://fapi.binance.com/fapi/v1/forceOrders?limit=50`);
    if(!res.ok) return;
    const data=await res.json();
    if(!Array.isArray(data)) return;
    data.forEach(o=>{
      const t=o.time||o.transactTime||0;
      if(t<=lastRestTime) return;
      const sym=o.symbol||'BTCUSDT';
      const qty=parseFloat(o.origQty||o.executedQty)||0;
      const price=parseFloat(o.avgPrice||o.price)||btcPrice;
      const usd=qty*price;
      const side=o.side==='BUY'?'SHORT':'LONG';
      addLiq({exchange:'Binance',sym,side,qty,price,usd});
    });
    if(data.length>0) lastRestTime=Math.max(...data.map(o=>o.time||o.transactTime||0));
  }catch(e){}
}

function setDot(exch,state){

// ===== HOVER =====
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  hovered=null;
  for(const b of bubbles){ if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){hovered=b;break;} }
  canvas.style.cursor=hovered?'pointer':'default';
  const tt=document.getElementById('tooltip');
  if(hovered){

    document.getElementById('ttTitle').innerHTML=`${hovered.isLong?'📈':'📉'} <span style="color:${hovered.col}">${hovered.isLong?'LONG':'SHORT'} Liquidation</span>`;

function playSound(usd,side){
  try{
    const ac=new AudioContext();
    const osc=ac.createOscillator(),g=ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.frequency.value=side==='LONG'?440:330;
    osc.type=usd>500000?'sawtooth':'sine';
    g.gain.setValueAtTime(0.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);
    osc.start(); osc.stop(ac.currentTime+0.6);
  }catch(e){}
}

// ===== FORMAT =====
function fmtN(n){ if(!n)return'0'; if(n>=1e9)return(n/1e9).toFixed(2)+'B'; if(n>=1e6)return(n/1e6).toFixed(2)+'M'; if(n>=1e3)return(n/1e3).toFixed(1)+'K'; return n.toFixed(0); }

// --- GATE.IO: liquidation stream ---
let wsGate;
function connectGate(){
  wsGate = new WebSocket('wss://fx-ws.gateio.ws/v4/ws/usdt');
  wsGate.onopen = () => {
    setDot('gate','on');
    const coins = ['BTC_USDT','ETH_USDT','SOL_USDT','BNB_USDT','XRP_USDT','DOGE_USDT','ADA_USDT','AVAX_USDT','LINK_USDT','DOT_USDT','LTC_USDT','NEAR_USDT','APT_USDT','ARB_USDT','OP_USDT'];

  };
  wsGate.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if(d.event==='subscribe') return;
      const arr = Array.isArray(d.result) ? d.result : [d.result];
      arr.forEach(o => {
        if(!o) return;
        const sym  = (o.contract || 'BTC_USDT').replace('_','');
        const qty  = Math.abs(parseFloat(o.size)) || 0;
        const price= parseFloat(o.order_price || o.fill_price) || btcPrice;
        const usd  = qty * price;
        const side = o.left >= 0 ? 'LONG' : 'SHORT';
        addLiq({ exchange:'Gate', sym, side, qty, price, usd });
      });
    } catch(err) {}
  };
  wsGate.onerror  = () => setDot('gate','err');
  wsGate.onclose  = () => { setDot('gate',''); setTimeout(connectGate, 3000); };
}

// --- HTX/Huobi: liquidation stream ---
let wsHTX;
function connectHTX(){
  wsHTX = new WebSocket('wss://api.hbdm.com/linear-swap-notification');
  wsHTX.onopen = () => {
    setDot('htx','on');
    // HTX uses sub format
    wsHTX.send(JSON.stringify({ sub:'public.*.liquidation_orders', id:'liq1' }));
  };
  wsHTX.onmessage = e => {
    try {
      // HTX sends gzipped data
      const text = typeof e.data === 'string' ? e.data : null;
      if(!text) return;
      const d = JSON.parse(text);
      if(d.ping){ wsHTX.send(JSON.stringify({pong:d.ping})); return; }
      if(!d.data) return;
      const arr = Array.isArray(d.data) ? d.data : [d.data];
      arr.forEach(o => {
        if(!o) return;
        const sym  = (o.contract_code || 'BTC-USDT').replace('-','').replace('SWAP','')+'USDT';
        const qty  = parseFloat(o.amount) || 0;
        const price= parseFloat(o.price) || btcPrice;
        const usd  = qty * price;
        const side = o.direction === 'buy' ? 'SHORT' : 'LONG';
        addLiq({ exchange:'HTX', sym, side, qty, price, usd });
      });
    } catch(err) {}
  };
  wsHTX.onerror  = () => setDot('htx','err');
  wsHTX.onclose  = () => { setDot('htx',''); setTimeout(connectHTX, 3000); };
}
