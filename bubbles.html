<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTrade — Crypto Bubbles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0d0d; color:#fff;
    font-family:'Inter',sans-serif;
    overflow:hidden; height:100vh; width:100vw;
  }

  /* TOP BAR */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(15,15,15,0.95);
    backdrop-filter:blur(20px);
    border-bottom:1px solid #222;
    padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
  }
  .tb-left { display:flex; align-items:center; gap:12px; }
  .logo { font-size:16px; font-weight:700; color:#fff; text-decoration:none; }
  .logo span { color:#00d4ff; }
  .back-btn { padding:5px 12px; background:rgba(255,255,255,0.08); border:1px solid #333; border-radius:7px; color:#aaa; font-size:11px; text-decoration:none; transition:all 0.2s; }
  .back-btn:hover { color:#fff; border-color:#555; }

  /* TIMEFRAME BUTTONS */
  .tf-group { display:flex; gap:4px; }
  .tf-btn {
    padding:5px 12px; border-radius:7px;
    background:rgba(255,255,255,0.06);
    border:1px solid #333; color:#888;
    font-size:11px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
    transition:all 0.2s;
  }
  .tf-btn:hover { color:#fff; border-color:#555; }
  .tf-btn.active { background:rgba(0,212,255,0.15); border-color:#00d4ff; color:#00d4ff; }

  /* FILTER */
  .filter-group { display:flex; gap:4px; }
  .filter-btn {
    padding:5px 12px; border-radius:7px;
    background:rgba(255,255,255,0.06);
    border:1px solid #333; color:#888;
    font-size:11px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
    transition:all 0.2s;
  }
  .filter-btn.active { background:rgba(255,255,255,0.12); border-color:#555; color:#fff; }

  /* STATS */
  .stats-row { display:flex; gap:14px; align-items:center; }
  .stat { font-size:11px; color:#666; }
  .stat b { color:#fff; font-weight:600; }
  .stat .up { color:#26a69a; }
  .stat .dn { color:#ef5350; }

  /* CANVAS */
  #bubbleCanvas {
    position:fixed;
    top:52px; left:0; right:0; bottom:0;
    width:100%; height:calc(100vh - 52px);
  }

  /* TOOLTIP */
  .tooltip {
    position:fixed; z-index:200;
    background:rgba(20,20,20,0.97);
    border:1px solid #333;
    border-radius:12px;
    padding:12px 16px;
    pointer-events:none;
    display:none;
    min-width:160px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }
  .tt-sym { font-size:16px; font-weight:700; margin-bottom:2px; }
  .tt-name { font-size:10px; color:#888; margin-bottom:8px; }
  .tt-price { font-size:14px; font-weight:600; margin-bottom:4px; }
  .tt-row { display:flex; justify-content:space-between; gap:16px; font-size:11px; margin-top:3px; }
  .tt-lbl { color:#666; }
  .tt-val { font-weight:600; }
  .up { color:#26a69a; }
  .dn { color:#ef5350; }

  /* LEGEND */
  .legend {
    position:fixed; bottom:16px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    background:rgba(15,15,15,0.9);
    border:1px solid #222; border-radius:20px;
    padding:8px 20px; font-size:11px; z-index:100;
  }
  .leg-item { display:flex; align-items:center; gap:5px; color:#888; }
  .leg-dot { width:10px; height:10px; border-radius:50%; }

  /* LOADING */
  .loading-screen {
    position:fixed; inset:0; z-index:300;
    background:#0d0d0d;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
  }
  .spinner { width:36px; height:36px; border:2px solid #222; border-top-color:#00d4ff; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .load-text { font-size:13px; color:#666; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadScreen">
  <div class="spinner"></div>
  <div class="load-text">Crypto bubbles load ho rahi hain...</div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-left">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="logo">TEST<span>TRADE</span> Bubbles</div>
  </div>

  <div class="tf-group">
    <button class="tf-btn" onclick="setTF('change1h',this)">1H</button>
    <button class="tf-btn active" onclick="setTF('change24h',this)">24H</button>
    <button class="tf-btn" onclick="setTF('change7d',this)">7D</button>
    <button class="tf-btn" onclick="setTF('change30d',this)">30D</button>
  </div>

  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('top100',this)">Top 100</button>
    <button class="filter-btn" onclick="setFilter('top50',this)">Top 50</button>
    <button class="filter-btn" onclick="setFilter('gainers',this)">🚀 Gainers</button>
    <button class="filter-btn" onclick="setFilter('losers',this)">📉 Losers</button>
  </div>

  <div class="stats-row">
    <div class="stat">Market: <b id="statMcap">—</b></div>
    <div class="stat">BTC: <b id="statBTC">—</b></div>
    <div class="stat">
      Gainers: <b class="up" id="statGain">—</b>
      / Losers: <b class="dn" id="statLoss">—</b>
    </div>
  </div>
</div>

<canvas id="bubbleCanvas"></canvas>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tt-sym" id="ttSym">BTC</div>
  <div class="tt-name" id="ttName">Bitcoin</div>
  <div class="tt-price" id="ttPrice">$0.00</div>
  <div class="tt-row"><span class="tt-lbl">1H</span><span class="tt-val" id="tt1h">—</span></div>
  <div class="tt-row"><span class="tt-lbl">24H</span><span class="tt-val" id="tt24h">—</span></div>
  <div class="tt-row"><span class="tt-lbl">7D</span><span class="tt-val" id="tt7d">—</span></div>
  <div class="tt-row"><span class="tt-lbl">MCap</span><span class="tt-val" id="ttMcap">—</span></div>
</div>

<!-- LEGEND -->
<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#1a6b5a"></div> Strong Gain</div>
  <div class="leg-item"><div class="leg-dot" style="background:#26a69a"></div> Gain</div>
  <div class="leg-item"><div class="leg-dot" style="background:#444"></div> Neutral</div>
  <div class="leg-item"><div class="leg-dot" style="background:#c62828"></div> Loss</div>
  <div class="leg-item"><div class="leg-dot" style="background:#7b0000"></div> Strong Loss</div>
  <div class="leg-item" style="color:#555">Size = Market Cap</div>
</div>

<script>
const canvas = document.getElementById('bubbleCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let allCoins = [];
let bubbles = [];
let currentTF = 'change24h';
let currentFilter = 'top100';
let animFrame;
let hoveredBubble = null;

// ===== FETCH DATA =====
async function fetchCoins() {
  try {
    const url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=1h,24h,7d,30d';
    const res = await fetch(url);
    if (!res.ok) throw new Error('API fail');
    const data = await res.json();
    allCoins = data.map(c => ({
      id:       c.id,
      sym:      c.symbol.toUpperCase(),
      name:     c.name,
      logo:     c.image,
      price:    c.current_price,
      mcap:     c.market_cap || 0,
      change1h:  c.price_change_percentage_1h_in_currency || 0,
      change24h: c.price_change_percentage_24h || 0,
      change7d:  c.price_change_percentage_7d_in_currency || 0,
      change30d: c.price_change_percentage_30d_in_currency || 0,
    }));

    updateStats();
    buildBubbles();
    document.getElementById('loadScreen').style.display = 'none';
  } catch(e) {
    document.getElementById('loadScreen').querySelector('.load-text').textContent = '⚠️ Data load nahi hua. Refresh karein.';
  }
}

// ===== STATS =====
function updateStats() {
  const btc = allCoins.find(c => c.sym === 'BTC');
  if (btc) {
    document.getElementById('statBTC').textContent = '$' + btc.price.toLocaleString('en-US', {maximumFractionDigits:0});
  }
  const totalMcap = allCoins.reduce((s,c) => s + c.mcap, 0);
  document.getElementById('statMcap').textContent = fmtLarge(totalMcap);

  const gainers = allCoins.filter(c => c[currentTF] > 0).length;
  const losers  = allCoins.filter(c => c[currentTF] < 0).length;
  document.getElementById('statGain').textContent = gainers;
  document.getElementById('statLoss').textContent = losers;
}

// ===== BUILD BUBBLES =====
function buildBubbles() {
  resizeCanvas();

  let coins = [...allCoins];

  if (currentFilter === 'top50')   coins = coins.slice(0, 50);
  if (currentFilter === 'gainers') coins = coins.filter(c => c[currentTF] > 0).sort((a,b) => b[currentTF] - a[currentTF]).slice(0, 50);
  if (currentFilter === 'losers')  coins = coins.filter(c => c[currentTF] < 0).sort((a,b) => a[currentTF] - b[currentTF]).slice(0, 50);

  const W = canvas.width;
  const H = canvas.height;

  // Size by mcap
  const maxMcap = Math.max(...coins.map(c => c.mcap));
  const minR = 18, maxR = Math.min(W, H) * 0.12;

  bubbles = coins.map(c => {
    const r = minR + ((c.mcap / maxMcap) ** 0.45) * (maxR - minR);
    return {
      ...c,
      r,
      x: r + Math.random() * (W - r * 2),
      y: r + Math.random() * (H - r * 2),
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      logo: null,
      logoLoaded: false,
    };
  });

  // Preload logos
  bubbles.forEach(b => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { b.logo = img; b.logoLoaded = true; };
    img.onerror = () => { b.logoLoaded = true; };
    img.src = allCoins.find(c => c.sym === b.sym)?.logo || '';
  });

  // Separate overlapping bubbles
  separateBubbles();

  if (animFrame) cancelAnimationFrame(animFrame);
  animate();
}

// ===== SEPARATE BUBBLES (no overlap) =====
function separateBubbles() {
  for (let iter = 0; iter < 80; iter++) {
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const a = bubbles[i], b = bubbles[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minDist = a.r + b.r + 3;
        if (dist < minDist && dist > 0) {
          const push = (minDist - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          clamp(a); clamp(b);
        }
      }
    }
  }
}

function clamp(b) {
  const W = canvas.width, H = canvas.height;
  b.x = Math.max(b.r, Math.min(W - b.r, b.x));
  b.y = Math.max(b.r, Math.min(H - b.r, b.y));
}

// ===== COLOR =====
function getColor(change, alpha = 1) {
  if (change > 10)  return `rgba(13,92,66,${alpha})`;
  if (change > 5)   return `rgba(22,101,82,${alpha})`;
  if (change > 2)   return `rgba(32,136,110,${alpha})`;
  if (change > 0)   return `rgba(38,166,154,${alpha})`;
  if (change > -2)  return `rgba(80,80,80,${alpha})`;
  if (change > -5)  return `rgba(180,50,50,${alpha})`;
  if (change > -10) return `rgba(198,40,40,${alpha})`;
  return `rgba(123,0,0,${alpha})`;
}

function getBorder(change) {
  if (change > 5)  return '#4ecca3';
  if (change > 0)  return '#26a69a';
  if (change > -5) return '#888';
  return '#ef5350';
}

// ===== ANIMATE =====
function animate() {
  animFrame = requestAnimationFrame(animate);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  bubbles.forEach(b => {
    // Gentle float
    b.x += b.vx;
    b.y += b.vy;

    // Bounce walls
    if (b.x - b.r < 0)  { b.x = b.r; b.vx *= -1; }
    if (b.x + b.r > W)  { b.x = W - b.r; b.vx *= -1; }
    if (b.y - b.r < 0)  { b.y = b.r; b.vy *= -1; }
    if (b.y + b.r > H)  { b.y = H - b.r; b.vy *= -1; }

    // Soft collision
    bubbles.forEach(other => {
      if (other === b) return;
      const dx = other.x - b.x, dy = other.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const minD = b.r + other.r + 2;
      if (dist < minD && dist > 0) {
        const push = 0.15;
        b.vx -= (dx/dist) * push;
        b.vy -= (dy/dist) * push;
        b.vx = Math.max(-0.8, Math.min(0.8, b.vx));
        b.vy = Math.max(-0.8, Math.min(0.8, b.vy));
      }
    });

    const change = b[currentTF];
    const isHovered = hoveredBubble === b;

    // Glow
    if (isHovered || Math.abs(change) > 5) {
      const glowColor = change >= 0 ? 'rgba(38,166,154,0.25)' : 'rgba(239,83,80,0.2)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + (isHovered ? 10 : 6), 0, Math.PI*2);
      ctx.fillStyle = glowColor;
      ctx.fill();
    }

    // Main bubble
    const grad = ctx.createRadialGradient(b.x - b.r*0.25, b.y - b.r*0.25, b.r*0.05, b.x, b.y, b.r);
    grad.addColorStop(0, getColor(change, 0.95));
    grad.addColorStop(1, getColor(change, 0.75));
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Border
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.strokeStyle = isHovered ? '#fff' : getBorder(change);
    ctx.lineWidth = isHovered ? 2 : 1;
    ctx.stroke();

    // Shine
    const shine = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, 0, b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.55);
    shine.addColorStop(0, 'rgba(255,255,255,0.18)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = shine;
    ctx.fill();

    // Layout based on bubble size
    // Large bubble (r > 45): logo top, symbol middle, % bottom
    // Medium bubble (r > 28): symbol top, % bottom
    // Small bubble (r <= 28): symbol only, tiny font

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const sign = change >= 0 ? '+' : '';
    const pctText = sign + change.toFixed(2) + '%';
    const pctColor = change >= 0 ? '#a7f3d0' : '#fca5a5';

    if (b.r > 42) {
      // LARGE: logo + symbol + %
      // 3 items: logo at -30%, symbol at +15%, pct at +45%
      const logoSize = b.r * 0.36;
      const logoY = b.y - b.r * 0.28;
      const symY  = b.y + b.r * 0.12;
      const pctY  = b.y + b.r * 0.46;

      // Logo
      if (b.logoLoaded && b.logo) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, logoY, logoSize/2, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(b.logo, b.x-logoSize/2, logoY-logoSize/2, logoSize, logoSize);
        ctx.restore();
      }
      // Symbol
      ctx.fillStyle = '#ffffff';
      ctx.font = `700 ${Math.floor(b.r * 0.21)}px Inter,sans-serif`;
      ctx.fillText(b.sym, b.x, symY);
      // Pct
      ctx.fillStyle = pctColor;
      ctx.font = `600 ${Math.floor(b.r * 0.18)}px Inter,sans-serif`;
      ctx.fillText(pctText, b.x, pctY);

    } else if (b.r > 26) {
      // MEDIUM: symbol + % — 2 lines, evenly spaced
      const gap = b.r * 0.28;
      const symY = b.y - gap * 0.5;
      const pctY = b.y + gap * 0.5;

      ctx.fillStyle = '#ffffff';
      ctx.font = `700 ${Math.floor(b.r * 0.30)}px Inter,sans-serif`;
      ctx.fillText(b.sym, b.x, symY);

      ctx.fillStyle = pctColor;
      ctx.font = `600 ${Math.floor(b.r * 0.24)}px Inter,sans-serif`;
      ctx.fillText(pctText, b.x, pctY);

    } else if (b.r > 14) {
      // SMALL: sym center, pct tiny below
      const symY = b.y - b.r * 0.15;
      const pctY = b.y + b.r * 0.38;

      ctx.fillStyle = '#ffffff';
      ctx.font = `700 ${Math.max(7, Math.floor(b.r * 0.35))}px Inter,sans-serif`;
      ctx.fillText(b.sym, b.x, symY);

      ctx.fillStyle = pctColor;
      ctx.font = `600 ${Math.max(6, Math.floor(b.r * 0.26))}px Inter,sans-serif`;
      ctx.fillText(pctText, b.x, pctY);

    } else {
      // TINY: just symbol
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = `700 ${Math.max(6, Math.floor(b.r * 0.55))}px Inter,sans-serif`;
      ctx.fillText(b.sym, b.x, b.y);
    }
  });
}

// ===== RESIZE =====
function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - 52;
}
window.addEventListener('resize', () => { resizeCanvas(); buildBubbles(); });

// ===== HOVER / CLICK =====
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;

  for (const b of bubbles) {
    const dx = mx - b.x, dy = my - b.y;
    if (Math.sqrt(dx*dx + dy*dy) < b.r) { found = b; break; }
  }

  hoveredBubble = found;
  canvas.style.cursor = found ? 'pointer' : 'default';

  if (found) {
    const tt = tooltip;
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top  = (e.clientY - 80) + 'px';
    document.getElementById('ttSym').textContent   = found.sym;
    document.getElementById('ttName').textContent  = found.name;
    document.getElementById('ttPrice').textContent = '$' + fmtPrice(found.price);
    const c1 = found.change1h,  c24 = found.change24h,
          c7 = found.change7d;
    document.getElementById('tt1h').innerHTML  = fmtChg(c1);
    document.getElementById('tt24h').innerHTML = fmtChg(c24);
    document.getElementById('tt7d').innerHTML  = fmtChg(c7);
    document.getElementById('ttMcap').textContent = fmtLarge(found.mcap);
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display='none'; hoveredBubble=null; });

// Touch support
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const mx = t.clientX - rect.left, my = t.clientY - rect.top;
  for (const b of bubbles) {
    const dx = mx-b.x, dy = my-b.y;
    if (Math.sqrt(dx*dx+dy*dy) < b.r) { hoveredBubble=b; break; }
  }
}, {passive:true});

// ===== CONTROLS =====
function setTF(tf, el) {
  currentTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  updateStats();
  buildBubbles();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  buildBubbles();
}

// ===== FORMAT =====
function fmtPrice(n) {
  if (!n) return '—';
  if (n >= 1000) return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (n >= 1)    return n.toFixed(4);
  return n.toFixed(6);
}
function fmtLarge(n) {
  if (!n) return '—';
  if (n >= 1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if (n >= 1e9)  return '$'+(n/1e9).toFixed(2)+'B';
  if (n >= 1e6)  return '$'+(n/1e6).toFixed(2)+'M';
  return '$'+n.toLocaleString();
}
function fmtChg(v) {
  if (v === null || v === undefined) return '<span style="color:#666">—</span>';
  const s = v>=0?'+':'';
  const col = v>=0?'#4ecca3':'#ef5350';
  return `<span style="color:${col};font-weight:600">${s}${v.toFixed(2)}%</span>`;
}

// ===== INIT =====
resizeCanvas();
fetchCoins();
setInterval(fetchCoins, 60000);
</script>
</body>
</html>
