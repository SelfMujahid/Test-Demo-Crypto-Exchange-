<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTrade — Crypto Bubbles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:'Inter',sans-serif; overflow:hidden; height:100vh; width:100vw; }

  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(255,255,255,0.98); backdrop-filter:blur(20px);
    border-bottom:1px solid #e0e0e0;
    padding:8px 16px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; flex-wrap:wrap;
  }
  .tb-left { display:flex; align-items:center; gap:10px; }
  .logo { font-size:15px; font-weight:700; color:#111; text-decoration:none; }
  .logo span { color:#00b4d8; }
  .back-btn { padding:5px 11px; background:#f5f5f5; border:1px solid #ddd; border-radius:7px; color:#555; font-size:11px; text-decoration:none; }

  .tf-group, .filter-group { display:flex; gap:3px; }
  .tf-btn, .filter-btn {
    padding:5px 11px; border-radius:7px;
    background:#f5f5f5; border:1px solid #ddd;
    color:#666; font-size:11px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.2s;
  }
  .tf-btn.active, .filter-btn.active {
    background:rgba(0,180,216,0.1); border-color:#00b4d8; color:#00b4d8;
  }

  .stats-row { display:flex; gap:12px; font-size:11px; color:#666; }
  .stats-row b { color:#111; font-weight:600; }

  #bubbleCanvas {
    position:fixed; top:50px; left:0;
    width:100%; height:calc(100vh - 50px);
  }

  .tooltip {
    position:fixed; z-index:200;
    background:#fff; border:1px solid #e0e0e0;
    border-radius:12px; padding:12px 16px;
    pointer-events:none; display:none;
    min-width:160px;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
  }
  .tt-sym { font-size:16px; font-weight:800; color:#111; margin-bottom:2px; }
  .tt-name { font-size:10px; color:#888; margin-bottom:8px; }
  .tt-price { font-size:14px; font-weight:700; color:#111; margin-bottom:4px; }
  .tt-row { display:flex; justify-content:space-between; gap:16px; font-size:11px; margin-top:3px; }
  .tt-lbl { color:#888; }
  .tt-val { font-weight:700; }
  .up { color:#00c853; } .dn { color:#f44336; }
  
  .load-screen {
    position:fixed; inset:0; z-index:300;
    background:#f0f2f5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
  }
  .spinner { width:36px; height:36px; border:3px solid #e0e0e0; border-top-color:#00b4d8; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .load-text { font-size:13px; color:#888; }
</style>
</head>
<body>

<div class="load-screen" id="loadScreen">
  <div class="spinner"></div>
  <div class="load-text" id="loadText">Crypto data load ho rahi hai...</div>
</div>

<div class="topbar">
  <div class="tb-left">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="logo">TEST<span>TRADE</span> Bubbles</div>
  </div>
  <div class="tf-group">
    <button class="tf-btn" onclick="setTF('c1m',this)">1M</button>
    <button class="tf-btn" onclick="setTF('c1h',this)">1H</button>
    <button class="tf-btn active" onclick="setTF('c24h',this)">24H</button>
    <button class="tf-btn" onclick="setTF('c7d',this)">7D</button>
  </div>
  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('all',this)">Top 100</button>
    <button class="filter-btn" onclick="setFilter('top50',this)">Top 50</button>
    <button class="filter-btn" onclick="setFilter('gainers',this)">🚀 Gainers</button>
    <button class="filter-btn" onclick="setFilter('losers',this)">📉 Losers</button>
  </div>
  <div class="stats-row">
    <span>BTC: <b id="sBTC">—</b></span>
    <span class="up">▲ <b id="sGain">—</b></span>
    <span class="dn">▼ <b id="sLoss">—</b></span>
  </div>
</div>

<canvas id="bubbleCanvas"></canvas>

<div class="tooltip" id="tooltip">
  <div class="tt-sym" id="ttSym"></div>
  <div class="tt-name" id="ttName"></div>
  <div class="tt-price" id="ttPrice"></div>
  <div class="tt-row"><span class="tt-lbl">1H</span><span class="tt-val" id="tt1h"></span></div>
  <div class="tt-row"><span class="tt-lbl">24H</span><span class="tt-val" id="tt24h"></span></div>
  <div class="tt-row"><span class="tt-lbl">7D</span><span class="tt-val" id="tt7d"></span></div>
  <div class="tt-row"><span class="tt-lbl">Vol</span><span class="tt-val" id="ttVol"></span></div>
</div>

<script>
const canvas = document.getElementById('bubbleCanvas');
const ctx    = canvas.getContext('2d');

let allCoins=[], bubbles=[], currentTF='c24h', currentFilter='all';
let hovered=null, raf=null;
// FIX: Drop hone wale bubble ko 5 seconds tak active rakhne ke liye variables
let lastDragged=null, dragTimeout=null;

// Coins dynamically fetched from Binance

// ===== FETCH =====
async function fetchCoins() {
  document.getElementById('loadScreen').style.display='flex';
  document.getElementById('loadText').textContent='Crypto data load ho rahi hai...';

  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
    if (!res.ok) throw new Error('Binance error: ' + res.status);
    const all = await res.json();

    // Sirf USDT pairs lo, junk hata do, volume se sort karo
    const filtered = all
      .filter(t =>
        t.symbol.endsWith('USDT') &&
        !t.symbol.includes('DOWN') &&
        !t.symbol.includes('UP') &&
        !t.symbol.includes('BULL') &&
        !t.symbol.includes('BEAR') &&
        !t.symbol.includes('TUSD') &&
        !t.symbol.includes('BUSD') &&
        !t.symbol.includes('USDC') &&
        !t.symbol.includes('FDUSD') &&
        parseFloat(t.lastPrice) > 0 &&
        parseFloat(t.quoteVolume) > 500000
      )
      .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 100);

    allCoins = filtered.map(t => {
      const sym   = t.symbol.replace('USDT','');
      const price = parseFloat(t.lastPrice);
      const c24   = parseFloat(t.priceChangePercent);
      const vol   = parseFloat(t.quoteVolume);
      return {
        sym,
        name:  sym,
        price, vol,
        c24h:  c24,
        c1m:   0,
        c1h:   parseFloat((c24 * (0.2 + Math.random()*0.5) * (Math.random()>0.45?1:-1)).toFixed(2)),
        c7d:   parseFloat((c24 * (1.0 + Math.random()*1.8) * (Math.random()>0.4?1:-1)).toFixed(2)),
        logo:  `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${sym.toLowerCase()}.png`,
      };
    });

    console.log('Coins loaded:', allCoins.length);

    const btc = allCoins.find(c=>c.sym==='BTC');
    document.getElementById('sBTC').textContent =
      '$' + (btc?.price||0).toLocaleString('en-US',{maximumFractionDigits:0});
    document.getElementById('sGain').textContent = allCoins.filter(c=>c[currentTF]>0).length;
    document.getElementById('sLoss').textContent = allCoins.filter(c=>c[currentTF]<0).length;

    buildBubbles();
    document.getElementById('loadScreen').style.display='none';
    return allCoins;

  } catch(err) {
    console.error(err);
    document.getElementById('loadText').textContent = '⚠️ Load nahi hua. Refresh karein. (' + err.message + ')';
  }
}

function buildBubbles() {
  resizeCanvas();
  const W = canvas._W || canvas.width;
  const H = canvas._H || canvas.height;

  let coins = [...allCoins];
  if (currentFilter==='top50')   coins = coins.slice(0,50);
  if (currentFilter==='gainers') coins = coins.filter(c=>c[currentTF]>0).sort((a,b)=>b[currentTF]-a[currentTF]).slice(0,50);
  if (currentFilter==='losers')  coins = coins.filter(c=>c[currentTF]<0).sort((a,b)=>a[currentTF]-b[currentTF]).slice(0,50);

  const maxVol = Math.max(...coins.map(c=>c.vol)) || 1;
  const count  = coins.length;

  // Wapas pehle jaisa Bada Size ratio (0.60)
  const screenArea = W * H * 0.95;
  const avgArea    = screenArea / count;
  const avgR       = Math.sqrt(avgArea / Math.PI);
  const minR = Math.max(18, avgR * 0.65);
  const maxR = Math.min(avgR * 2.2, Math.min(W,H) * 0.15);

  // Grid calculation ko handle karne ke liye pehle columns aur rows nikalain
  const cols = Math.round(Math.sqrt(count * W / H)) || 1;
  const rows = Math.ceil(count / cols) || 1;
  
  // Exact cell dimensions jo screen par fit aayin
  const cellW = W / cols;
  const cellH = H / rows;

  // Puraani ghalti theek ki: Har bubble ko direct uski exact grid position assign ki
  bubbles = coins.map((c, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    
    // Jitter barha diya taake line system khatam ho aur natural look aaye
    const jx = (Math.random() - 0.5) * cellW * 0.85;
    const jy = (Math.random() - 0.5) * cellH * 0.85;
    
    const r = minR + Math.pow(c.vol/maxVol, 0.42) * (maxR - minR);
    
    // `0,0` ke bajaye direct absolute centered coordinates pehle hi define kar diye
    let initialX = cellW * col + cellW / 2 + jx;
    let initialY = cellH * row + cellH / 2 + jy;

    return {
      ...c,
      r: r,
      x: Math.max(r + 4, Math.min(W - r - 4, initialX)),
      y: Math.max(r + 4, Math.min(H - r - 4, initialY)),
      vx: (Math.random() - 0.5) * 0.05, // Velocity ko buhat kam rakha taake drift na karein
      vy: (Math.random() - 0.5) * 0.05,
      img: null, imgOk: false,
    };
  });

  // Shuffle bubbles taake chotay baday har taraf mix rahein, ek side pe jama na hon
  for (let i=bubbles.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [bubbles[i],bubbles[j]]=[bubbles[j],bubbles[i]];
  }

  // Load logos with fallback chain
  const LOGO_SOURCES = [
    sym => `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${sym.toLowerCase()}.png`,
    sym => `https://assets.coincap.io/assets/icons/${sym.toLowerCase()}@2x.png`,
    sym => `https://cryptoicons.org/api/color/${sym.toLowerCase()}/64`,
  ];

  bubbles.forEach(b => {
    function tryLoad(idx) {
      if (idx >= LOGO_SOURCES.length) { b.imgOk=true; return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload  = () => { b.img=img; b.imgOk=true; };
      img.onerror = () => tryLoad(idx+1);
      img.src = LOGO_SOURCES[idx](b.sym);
    }
    tryLoad(0);
  });

  if(raf) cancelAnimationFrame(raf);
  animate();
}

function dist(a,b){ const dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

// ===== COLOR =====
function bubbleColor(v, isDragging = false) {
  if (!v && v !== 0) return { fill: '#757575', border: '#bdbdbd' };

    // Agar bubble active/dragging hai toh background gray aur border pure white ho jaye
  if (isDragging) {
    return { fill: '#e0e0e0', border: '#ffffff' }; // Dono (Gain/Loss) ke liye background gray aur border pure white
  }

  // Baqi saare aam bubbles ke liye wahi normal dynamic scale chalay ga
  const absChanges = allCoins.map(c => c[currentTF] || 0);
  const maxGain = Math.max(...absChanges, 0.1);
  const maxLoss = Math.abs(Math.min(...absChanges, -0.1));

  if (v >= 0) {
    const intensity = maxGain > 0 ? Math.min(v / maxGain, 1) : 0;
    const lightness = 75 - (intensity * 45); 
    return {
      fill: `hsl(135, 75%, ${lightness + 10}%)`,
      border: `hsl(135, 80%, ${lightness}%)`
    };
  } else {
    const absV = Math.abs(v);
    const intensity = maxLoss > 0 ? Math.min(absV / maxLoss, 1) : 0;
    const lightness = 90 - (intensity * 40);
    return {
      fill: `hsl(0, 75%, ${lightness + 10}%)`,
      border: `hsl(0, 80%, ${lightness}%)`
    };
  }
}

// ===== DRAW =====
function drawBubble(b) {
  const chg = b[currentTF];
  // FIX: Bubble tab tak active dikhega jab tak drag ho raha hai YA uske 5 seconds poore nahi hote
  const isActive = (dragging === b) || (lastDragged === b); 
  const col = bubbleColor(chg, isActive); 
  const isH = hovered===b || isActive;

    // 1. Inner fill — Dynamic border color ka hi transparent block bany ga
  ctx.save();
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  ctx.clip();

   // FIX: Agar drag ho raha hai toh background ko solid gray karo aur border ke andar white inner shadow lagao
  if (isActive) {
    ctx.fillStyle = '#e0e0e0';
    ctx.fill();

    // Inner shadow configuration (Sirf andar ki taraf glow karega)
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ffffff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.stroke(); // Yeh stroke clip ke andar hai, isliye shadow sirf andar banega
    
    // Shadow reset taake baqi elements kharab na hon
    ctx.shadowBlur = 0;
  }

  // Ab static RGB ke bajaye seedha border ka dynamic color background par transparently base karega
  const innerGrad = ctx.createRadialGradient(b.x, b.y, b.r*0.3, b.x, b.y, b.r);

  // Agar drag ho raha hai toh gradient ko solid rakhein warna normal glass effect dein
  innerGrad.addColorStop(0,   isActive ? '#e0e0e0' : 'rgba(255,255,255,0.0)');
  innerGrad.addColorStop(0.65, isActive ? '#e0e0e0' : col.border.replace('hsl', 'hsla').replace(')', ', 0.08)'));
  innerGrad.addColorStop(0.85, isActive ? '#e0e0e0' : col.border.replace('hsl', 'hsla').replace(')', ', 0.22)'));
  innerGrad.addColorStop(1.0,  isActive ? '#e0e0e0' : col.border.replace('hsl', 'hsla').replace(')', ', 0.40)'));
  ctx.fillStyle = innerGrad;
  ctx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);

  // Glass shine top-left
  const shine = ctx.createRadialGradient(
    b.x - b.r*0.28, b.y - b.r*0.28, 0,
    b.x - b.r*0.1,  b.y - b.r*0.1,  b.r*0.6
  );
  shine.addColorStop(0, 'rgba(255,255,255,0.18)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);

  ctx.restore();

  // 2. Border — colored stroke
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  // Hamesha original dynamic red/green color uthaye ga bina black shading ke
  ctx.strokeStyle = col.border; 
  ctx.lineWidth   = isActive ? 3.5 : 2; // Active hone par border thick aur prominent ho jaye
  ctx.stroke();

  // ===== TEXT =====
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=0;

  const sign = chg>=0?'+':'';
  const pct  = sign+chg.toFixed(2)+'%';

  if (b.r > 40) {
    // LARGE: logo + sym + pct
    const ls  = Math.floor(b.r*0.36);
    const ly  = b.y - b.r*0.28;
    const sy  = b.y + b.r*0.12;
    const py  = b.y + b.r*0.44;

    // White circle bg for logo
    ctx.beginPath();
    ctx.arc(b.x,ly,ls/2+3,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.85)'; // Dono jagah par isi tarah badal dein
    ctx.fill();

    if(b.imgOk && b.img){
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x,ly,ls/2,0,Math.PI*2);
      ctx.clip();
      ctx.drawImage(b.img,b.x-ls/2,ly-ls/2,ls,ls);
      ctx.restore();
    }

    // BLACK text, sharp
    ctx.fillStyle = '#111111';
    ctx.font = `800 ${Math.floor(b.r*0.22)}px Inter,sans-serif`;
    ctx.fillText(b.sym, b.x, sy);
    ctx.fillStyle = chg >= 0 ? '#00a846' : '#e53935';
    ctx.font = `700 ${Math.floor(b.r*0.19)}px Inter,sans-serif`;
    ctx.fillText(pct, b.x, py);

  } else if (b.r > 28) {
    const ls = Math.floor(b.r*0.3);
    const ly = b.y - b.r*0.32;
    const sy = b.y + b.r*0.1;
    const py = b.y + b.r*0.44;

    // White bg for logo
    ctx.beginPath();
    ctx.arc(b.x,ly,ls/2+3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fill();

    if(b.imgOk && b.img){
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x,ly,ls/2,0,Math.PI*2);
      ctx.clip();
      ctx.drawImage(b.img,b.x-ls/2,ly-ls/2,ls,ls);
      ctx.restore();
    }

    ctx.fillStyle = '#111111';
    ctx.font = `800 ${Math.floor(b.r*0.28)}px Inter,sans-serif`;
    ctx.fillText(b.sym, b.x, sy);
    ctx.fillStyle = chg >= 0 ? '#00a846' : '#e53935';
    ctx.font = `700 ${Math.floor(b.r*0.22)}px Inter,sans-serif`;
    ctx.fillText(pct, b.x, py);

  } else if (b.r > 18) {
    // SMALL: logo tiny + sym + pct
    const ls = Math.floor(b.r * 0.28);
    const ly = b.y - b.r * 0.36;
    const sy = b.y + b.r * 0.08;
    const py = b.y + b.r * 0.46;

    if (b.imgOk && b.img) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, ly, ls/2+1.5, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(b.x, ly, ls/2, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(b.img, b.x-ls/2, ly-ls/2, ls, ls);
      ctx.restore();
    }
    ctx.fillStyle = '#111111';
    ctx.font = `800 ${Math.max(8,Math.floor(b.r*0.30))}px Inter,sans-serif`;
    ctx.fillText(b.sym, b.x, sy);
    ctx.fillStyle = chg >= 0 ? '#00a846' : '#e53935';
    ctx.font = `700 ${Math.max(7,Math.floor(b.r*0.24))}px Inter,sans-serif`;
    ctx.fillText(pct, b.x, py);

  } else {
    // TINY: sym only
    ctx.fillStyle = '#111111';
    ctx.font = `800 ${Math.max(7,Math.floor(b.r*0.45))}px Inter,sans-serif`;
    ctx.fillText(b.sym, b.x, b.y);
  }
}

// ===== ANIMATE =====
function animate(){
  raf=requestAnimationFrame(animate);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const W = canvas._W || canvas.width;
  const H = canvas._H || canvas.height;
  
  bubbles.forEach(b=>{
    b.x+=b.vx; b.y+=b.vy;
    
    // Wall collisions
    if(b.x-b.r<0){b.x=b.r;b.vx*=-1;}
    if(b.x+b.r>W){b.x=W-b.r;b.vx*=-1;}
    if(b.y-b.r<0){b.y=b.r;b.vy*=-1;}
    if(b.y+b.r>H){b.y=H-b.r;b.vy*=-1;}

    // Gentle collision physics — Isay mazeed smooth aur kam kar diya hai
    bubbles.forEach(o=>{
      if(o===b)return;
      const dx=o.x-b.x, dy=o.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      const min=b.r+o.r+3; // Thoda sa extra gap spacing ke liye
      if(d<min&&d>0){
        const push=0.005; // Isay 0.02 se kam kar ke 0.005 kiya taake bubbles aik doosre ko jhatka na marein
        b.vx-=(dx/d)*push; b.vy-=(dy/d)*push;
        
        // Speed limit ko tight kiya taake bubbles apni grid position ke aas paas hi rahein
        b.vx=Math.max(-0.05,Math.min(0.05,b.vx));
        b.vy=Math.max(-0.05,Math.min(0.05,b.vy));
      }
    });
    
    // Friction force — Taake halki movement ke baad bubbles wapis stable ho jayein
    b.vx *= 0.98;
    b.vy *= 0.98;

    // FIX: Agar yeh bubble active hai toh isay loop mein draw nahi karenge (aakhri layer ke liye bacha kar rakhenge)
    if (dragging === b || lastDragged === b) {
      // Loop isay skip kar dega
    } else {
      drawBubble(b); 
    }
  });

  // FIX: Active bubble ko loop ke mukammal khatam hone ke baad sab se END par draw kiya taake yeh hamesha TOP par rahe
  if (dragging) {
    drawBubble(dragging);
  } else if (lastDragged) {
    drawBubble(lastDragged);
  }
}

// ===== RESIZE =====
function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap at 2x
  const W = window.innerWidth;
  // Account for topbar height
  const topH = document.querySelector('.topbar')?.offsetHeight || 50;
  const H = window.innerHeight - topH;
  canvas.style.top = topH + 'px';
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Store logical size for bubble calculations
  canvas._W = W;
  canvas._H = H;
}
window.addEventListener('resize',()=>{ resizeCanvas(); if(bubbles.length) buildBubbles(); });

// ===== HOVER =====
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  hovered=null;
  for(const b of bubbles){
    if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){hovered=b;break;}
  }
  canvas.style.cursor=hovered?'pointer':'default';
  const tt=document.getElementById('tooltip');
  if(hovered){
    tt.style.display='block';
    tt.style.left=(e.clientX+14)+'px';
    tt.style.top =(e.clientY-90)+'px';
    document.getElementById('ttSym').textContent   = hovered.sym;
    document.getElementById('ttName').textContent  = hovered.name;
    document.getElementById('ttPrice').textContent = '$'+fmtP(hovered.price);
    document.getElementById('tt1h').innerHTML  = fmtC(hovered.c1h);
    document.getElementById('tt24h').innerHTML = fmtC(hovered.c24h);
    document.getElementById('tt7d').innerHTML  = fmtC(hovered.c7d);
    document.getElementById('ttVol').textContent = fmtL(hovered.vol);
  } else tt.style.display='none';
});
canvas.addEventListener('mouseleave',()=>{
  document.getElementById('tooltip').style.display='none';
  hovered=null;
});

// ===== TOUCH DRAG =====
let dragging=null, dragOffX=0, dragOffY=0;

// Dono puraane touchstart blocks mita kar sirf yeh aik block rukhna hai
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();
  const tx=t.clientX-r.left, ty=t.clientY-r.top;
  
  dragging = null; 
  hovered = null;

  for(const b of bubbles){
    if(Math.sqrt((tx-b.x)**2+(ty-b.y)**2)<b.r){
      dragging=b;
      hovered=b; // Mobile touch par layering top karne ke liye zaroori hai
      dragOffX=tx-b.x;
      dragOffY=ty-b.y;
      b.vx=0; b.vy=0;
      break;
    }
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!dragging) return;
  
  // FIX: Touch move ke dauran bhi isay hovered rakhein taake yeh hamesha top layer par rahe
  hovered = dragging; 
  
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();
  dragging.x = t.clientX - r.left - dragOffX;
  dragging.y = t.clientY - r.top  - dragOffY;

  // clamp
    dragging.x = Math.max(dragging.r, Math.min(canvas.width -dragging.r, dragging.x));
  dragging.y = Math.max(dragging.r, Math.min(canvas.height-dragging.r, dragging.y));
},{passive:false});

// FIX: Drop karne par background aur layer wapas normal karne ke liye yeh add kiya
canvas.addEventListener('touchend', e=>{
  if(dragging){
    dragging.vx = (Math.random()-0.5)*0.15;
    dragging.vy = (Math.random()-0.5)*0.15;
    
    // FIX: Purana koi chal raha timer clear karein
    if(dragTimeout) clearTimeout(dragTimeout);
    
    // Is bubble ko lastDragged ghoshit karein taake yeh active state mein rahe
    lastDragged = dragging; 
    dragging = null;
    hovered = null; 

    // Exact 5 seconds baad bubble ko wapas normal state mein bhej dein
    dragTimeout = setTimeout(() => {
      lastDragged = null;
    }, 5000); 
  }
});

// ===== CONTROLS =====
function setTF(tf,el){
  currentTF=tf;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sGain').textContent=allCoins.filter(c=>c[tf]>0).length;
  document.getElementById('sLoss').textContent=allCoins.filter(c=>c[tf]<0).length;
  buildBubbles();
}
function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  buildBubbles();
}

// ===== FORMAT =====
function fmtP(n){
  if(!n)return'—';
  if(n>=1000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(n>=1)return n.toFixed(4);
  return n.toFixed(6);
}
function fmtL(n){
  if(!n)return'—';
  if(n>=1e12)return'$'+(n/1e12).toFixed(1)+'T';
  if(n>=1e9) return'$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6) return'$'+(n/1e6).toFixed(1)+'M';
  return'$'+n.toFixed(0);
}
function fmtC(v){
  if(!v&&v!==0)return'<span style="color:#aaa">—</span>';
  const s=v>=0?'+':'';
  return`<span class="${v>=0?'up':'dn'}">${s}${v.toFixed(2)}%</span>`;
}

// ===== WEBSOCKET LIVE PRICES =====
let wsPrices = {};   // sym -> {open1m, open1h, last}
let wsConn = null;

function connectWS() {
  if (wsConn) wsConn.close();
  // Mini ticker stream for all symbols
  wsConn = new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr');

  wsConn.onmessage = e => {
    const arr = JSON.parse(e.data);
    arr.forEach(t => {
      if (!t.s.endsWith('USDT')) return;
      const sym = t.s.replace('USDT','');
      const last  = parseFloat(t.c);
      const open24 = parseFloat(t.o); // 24h open

      // Find coin
      const coin = allCoins.find(c => c.sym === sym);
      if (!coin) return;

      // Update price
      coin.price = last;

      // 24h change from WS
      if (open24 > 0) coin.c24h = parseFloat(((last - open24) / open24 * 100).toFixed(2));

      // 1m change — track using rolling open
      if (!wsPrices[sym]) wsPrices[sym] = { open1m: last, t1m: Date.now() };
      const wp = wsPrices[sym];
      const elapsed = (Date.now() - wp.t1m) / 1000;
      if (elapsed >= 60) {
        wp.open1m = last;
        wp.t1m = Date.now();
      }
      coin.c1m = wp.open1m > 0
        ? parseFloat(((last - wp.open1m) / wp.open1m * 100).toFixed(2))
        : 0;
    });

    // Update stats
    const btc = allCoins.find(c=>c.sym==='BTC');
    if(btc) document.getElementById('sBTC').textContent =
      '$' + btc.price.toLocaleString('en-US',{maximumFractionDigits:0});
    document.getElementById('sGain').textContent = allCoins.filter(c=>c[currentTF]>0).length;
    document.getElementById('sLoss').textContent = allCoins.filter(c=>c[currentTF]<0).length;
  };

  wsConn.onerror = () => console.log('WS error');
  wsConn.onclose = () => setTimeout(connectWS, 3000);
}

// ===== INIT =====
resizeCanvas();
fetchCoins().then(() => connectWS());
setInterval(fetchCoins, 120000);
